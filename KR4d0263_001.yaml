body:
  text: 藝庵類藁卷一宋李洪撰賦適越賦出修門而東騖兮駕靈胥之怒濤命榜人而理櫂兮御龍驤之巨艘睨組練之噴薄兮忽鵝鸛之鳴號江海渺瀰以東注兮雉堞屹然而增牢啓東南之王氣兮應赤縣之神臯仰中天之華闕兮非煙鬱以霞韜慶警蹕之清夷兮見弓矢之載櫜届西陵以爰憩兮灌木蔚乎蓬蒿叢祠鴉噪而日暝兮古戍鬻海以烹熬越山千嶂以相矗兮斷港縈迂而一篙臨錢清之汐浸兮拖廢埭之輕艚覽禹穴之敻古兮嗟㑹稽之棲勞悼壯圖於種蠡兮鐫諂辭於斯髙眺蓬萊之清勝兮懷蘭亭之俊髦史遷之遊孰繼蕺山之扇誰操少陵壯節之英遊兮太白俊逸之詩豪泛鑑湖之佳致兮羡外監之嬉遨讀幼婦之刻辭兮遺貌摽夫孝曹弔貞魂於千載兮奠桂醑之單醪夜宿上虞舜風所陶民淳尚存於濬井鳥馴猶象於耘􅘥三江既泛其洶湧萬壑亦飫於嶗嶆姚江縈帶而並海兮四眀勃鬱以周遭山峭拔而益竒溪洄洑而滔滔雲獻狀而絶態松逞姿而蝟毛猿清吟而送客竹蓊薈而解苞雨淙淙而鳴瀑風颼颼而勢叨豫既冥搜而遐矚聊舒嘯以抽毫苦益菜賦并序李子閒居自暇從老圃灌畦育蔬日忘其勞客有以山中苦益菜為餉葅芼調聏嘉其小苦微甘咀嚼雋永似乎忠臣醫國之言也賦以自廣瞻清晨之始旦獨植杖而灌園遡望舒之落月逆扶桑之朝暾零露漙兮薤本敗葉委兮葵根紛冒㙭而甲拆擢翠羽以庶蕃顧不熟而為饉豈飯芼於盤飱時乃享庾郎之三九擅諸葛之五利想千里之蓴羮擷五溪之春薺誑杞菊於天隨嗜芥芹於羊鼻人莧發園官之譏馬蘭寓玉川之意客有拔葰茂於山椒濯滄浪之水裔羞我鼎鉶芼之薑桂其苦口若批音必結反鱗之切諌其愈疾若上池之良劑萇宏染指而化碧賈誼濡脣而流涕故國醫針在肓之疾忠言趣躡足之計既謙受而為益信雋永之有味彼啜羮之少恩不如放麑之多仁紾臂而得食有類轑釡之無親肆甘言之慫慂美佞舌之囁嚅鼻莫辨於薰蕕憂寧忘於萱蘇矧茲菜之耿介宜棄置於路隅然而嵗寒後凋者松柏所獨主聖臣直者社稷之福鑑至眀者察妍蚩於顧盻水既止者視毫髮與眉目從諫有轉圜之易去佞無拔山之酷漢文除挾書之禁堯庭設誹謗之木嘻其甚哉此野人炙背之獻異聖哲啓心之沃徒采薇於西山慕白駒於空谷固不足以當宣室前席之咨而備廣厦細旃之瀆哀巖桂賦并序版曹㕔前有巖桂焉根幹凋瘁枝葉萎薾秋八月山中之桂爛然吐芬芳薌襲人兹桂也封殖失地坐視羣葩競秀不能榮擢其華爭妍一時客有白事長二退而問於李子僕對曰木猶人也士之賦材稟教懷文抱質不猶此木之受氣育形乎種學績文澡身浴德不猶此木之芬芳郁烈乎挺姿嵗寒老死巖穴不猶此木之託植山谷乎彈冠結綬願登王畿不猶此木之徙幽崖而入帝鄉乎逮其爭春於蒲桞之側承澤於文昌之臺見辱皂𨽻取誚輿儓日滋月往遂為枯荄不亦可哀乎客又何怪客跽而請子其賦之僕曰唯唯伊金風之浩蕩兮將摧殘於衆芳何巖桂之挺特兮獨稟粹于皓商著家聲于荒逺兮擅蟠根于后皇亶育靈于蟾窟兮乃移植于帝鄊擢自拱把斸彼巖隈小山叢生而寓興墨客一枝而寄懷竟悵望于空谷思委質于瑶階時也少昊回御萬寶向成藴通犀之內德藹文客之擅名露漙漙兮仙掌借潤風嫋嫋兮天籟發清或秀拔夫差之茂苑或香動東甌之粵城鞠衣沮豔薝蔔慚馨懼過時而薄采羞自衒以含情則有騷人逋客頭陀煉士或棲山庱之寂寥或飲沆瀣而度世既迢遙於間曠亦泯絶於勢利乃吸墜露以嗅其菁英展裓衣而收其荂蘂或佩服以配秋蘭之紉或薰沐以陋薔薇之水非其標致不凡安得賞玩若此至於結根靈囿託體連昌晞鳯蓋之朝日被龍顔之末光白榆厯厯於天上江梅垂垂於玉堂依堯蓂而並砌嗤漢柏之為梁今則立文昌之禁省昡金爐之夕燻地近左戶時當小春無連珠聚星之吟客有鞭算心計之重臣惟國用之所制匪詞人之擬倫埋沒於喧囂倥偬之地低回於霜霰風雪之辰纎柯困於敲榜蒸粟化於緇塵俗眼屢白捧心漫顰莫不對春雨而泫泣望秋日以傷神然其深根固蒂而負嵗寒之期改柯易葉而無搖落之變儻遇鄒律之吹噓郭駝之善幻濯錦成榿木之園博望致蒲萄之館沐之以西湖之清波植之以孤山之絶岸尚能偃蹇媻姍於靈鷲之崖蓊薈蕭森於廣寒之殿毋入門而見嫉豈深谷之徒怨也於是子墨客卿起而為山中招隱之辭曰秋桂叢生託巖阿兮團欒葰茂稟太和兮回溪深壑水揚波兮秋風披拂蘭菊芳兮郁烈裊娜芬都房兮一粟粒中萬斛薌兮山中之人玉雲顔兮薜荔女蘿䝉譏訕兮歸歟歸歟保嵗寒兮雙鶴賦并序侍講舍人胡邦衡清節忠言冠冕當代具疏誅姦眀若蓍龜厭服天下若漢汲大夫近古社稷臣炳炳千古名烈莫二方犯雷霆之怒回薄嶺海南極窮髮二十六年處之泊焉與造物者逰晚際上皇更化趣使來朝轍環萬里入天官冠蓬省司言動掌綸制今天子優禮舊德以祭酒侍經幄日進嘉謨隂功隱利膏澤天下多矣直廬靜深庭有一鶴緇襟俯啄戞然長鳴命儔寥廓俄有胎禽𤣥裳羽衣將翺將翔軒然來儀麾之不去遂玩雙鶴昔趙清獻入蜀以一鶴一龜自隨李文正公居洛亦名六客鶴其一焉惟公清節可嫓清獻而謨猷剴切視文正無愧將晉秉國鈞為社稷鎮功成身退從赤松逰雖驂仙人之騏驥朝𤣥圃而夕瀛洲為不難也賦曰敞直廬之靚邃兮有獨舞之胎仙服深衣之古雅兮視倒景以留連神清臞而貌閒曠兮若俯啄於芝田時戞然以長鳴兮由命侣而翩翩嘉此九臯之逸翮兮擅凌虛而得仙斯真人之騏驥兮著法相於浮丘之篇公方愛而玩之兮誦蘂珠以延年舞琴心之三疊兮挹洪崖以拍肩愍茲世之垢頑兮遂謁帝於鈞天冠切雲而佩陸離兮襲蘺芷而紉蕙蘭建十絶之桂旗兮鏘玉鑾而中周旋闖九閽之蠖濩兮厲貔虎之當關羣犬狺狺以吠日兮駭嗾獒之㘖㘖彼衆口之鑠金兮競兒柔而婢顔撫長劍而拂旬始兮斬䝟貐而落女媊挾日月以陵清都兮讒夫媢豫之昌言排閶闔而躡泰階兮悵幽憤之莫蠲下大荒而隘宇宙兮絶瀛海以南轅亂湘波而愍英皇兮從虞巡而弗還投雄詞以悼靈均兮痛汨羅之沉寃上九嶷以望蒼梧兮聞韶音而忘餐涉窮髮而歷儋耳兮雖九夷而亦安躬踐蛇以茹蠱兮豈能侵靈府之浩然慨嵗月之何永兮再終星紀之二躔視蠅營與狗苟兮皆萬墳之壓顛帝秉籙以賜環兮入承眀而侍細旃非向之騎麒麟而控仙驥兮支造物而逰廣寒又安得茲羽鶴也感在隂而儷焉亶中孚之信及豚魚兮羌孰得而究研歎鳳鳥之不至兮聖若宣尼而有言也廣大鵬而作賦兮白乃憤發於塵編也感鸜鵒之入貢兮愈自傷於迍邅也因鸚鵡以娛賓兮衡亦罹夫巧諞也維茲雙鶴之偉觀兮託君子而稱賢也亂曰洪範五福貴眉夀兮詩人作歌惟黃耉兮懿茲胎禽寥廓偶兮翩然來儀如賓舊兮千年毳翎天地久兮清獻之清文正友兮公致太平垂不朽兮萬古仰之如泰斗兮殤幼賦并序余稚子直均未字而夭余與妻盛哭之哀而不成聲嗚呼吾兒踰朞而能行聰悟而敏慧甫三嵗已能捉筆模字效兄姊誦書不忘生之嵗月時幹全甲戊庚皆居寅合於日之亥不幸遇疾余有五林之役歸自外疾革視之形神離矣嗚呼痛哉昔羊祜五嵗探桑木中金環白樂天七月能識之無古皆謂再來嗟乎人稟一真之性幻滅幻生汨於生死大苦海中自非上根頓悟通其夙命者孰能超出輪回非幻不滅而脫離生死究竟真諦也哉余視其母悲傷弗忍忘作殤幼之詞極於性命生死之說塞余悲焉嗟人生於萬化兮汨真識以嬗形稟五緯之純粹兮託二儀以育靈視幻滅於瞿曇兮齊夀夭於殤彭哀稚子之韶美兮甫弱嵗之三齡既穎異而翹秀兮暨學語而和平詫庭蘭之茁茂兮齊玉雪之敷榮余薄祜而鍾罰兮痛夭閼於孺嬰訴九閽之􅌄窱兮闖北辰之列星彼穹穹與昊昊兮臨下民而俯聽杳不聞於哀籲兮氣澌盡而冥冥割衷腸之九回兮懮菀悶而填膺攬衣篝之故迹兮時誤稱於遺名愍號咷於慈母兮傷􅉃怛於姊兄惝恍而疑其死兮杳不聞於履聲惚然而謂之生兮訝泯絶而無徴沕神理之茫昧兮戢精爽之依憑風飄飄而振幃兮雨淋淋而霣楹草夤緣而依砌兮雀躑躅而悲鳴恍春暉之芳芷兮忽霜霰而先零視崦嵫之頽景兮悵營魂之遐征竁黃壚而閟質兮無倣佛於平生誶曰泣既盡而繼血兮髮變白以垂領瞭濁昏而喪眀兮涕橫集而委綆哀稚子之無年兮即厚夜而徂永悲童烏而草𤣥兮踵叔子之探環懷東門之曠達兮豈情鍾而愛捐覺大夢以蘧然兮銜永疚於終天悟龜毛於真詮兮將返初於泰始又安得羽化而飛仙五言古詩殘春雨夜讀陳子髙詩用其韻春事忽已闌年華何駛急客子困窮年卧若蛇蚓蟄泥深沒屐齒市橋燈熠熠殘缸玉蟲綴簷雨泫如泣歸期儻有徴緩我百憂集余生本畸人三年楚囚縶經商逐毫末索米慁畿邑君門深九重無籍豈敢入涸轍望斗升然桂炊玉粒妻孥寄田廬誅茒冬未葺朅來幾弦晦漏屋想沾濕但喜一犁足犉犢起􅟲􅟲耕耨貴及時歸歟具籉笠贈史康時二首叔夜史侯眉山英壯嵗陪戎旃胸蟠九雲夢筆倒三峽泉封侯直易爾唾手平幽燕相國昔分陜幕府羅雋賢公於二三子骯髒孰差肩綸巾白羽扇談笑清渭汧功名晚蹉跎肯著祖逖鞭南游上㑹稽却泛洞庭船九嶷多隱逸千里跨馬韀邂逅闔閭城傾蓋欣忘年誦我阮籍詩三歎涕泗漣客懷巳趣裝握手臨道邉歸歟指衡麓未辦買山錢他年遇回雁寄我湘中篇霜飈何凄冽嵗晏同漂泊男兒志四方寧久怨落魄懷忠思報國結義重然諾死生貧賤間交情今寂寞羞觀世態澆未遇所立卓英衮卧東山南極仰衡霍復期㝢縣清重使混沌鑿㑹見官儀修再卜東邑洛否運行當傾宇宙見開拓他年功名逼豈但持禁橐堂堂蒼鬚眉形貌畫麟閣如何决此行徑欲就邱壑五十非無聞斯文猶木鐸願保千金軀百鳥見一鶚贈支提德最我昔觀華嚴心熟毗盧境東南有支提千聖㑹巖嶺欲從善財問悵此路悠永朅來縻王事勝處每參請彈指開重樓結願發深省寄謝德雲師相見在别頂禪翁遊江湖傳衣自雙徑向來梅子熟一衲伴千聖十年此趺坐樓閣方鼎盛夜闌撥爐灰衲也吾所敬我如老摩詰到處扣禪病接淅復過雲林端隔清磬送江叔源除太府丞柯山需次威鳳翔千仭覽輝以來儀天驥渥窪種籋雲不受羈江侯南國珍劒佩光陸離三道對清問萬言敷針規雲霄跬步躡分教小差池中都冠蓋躔屈處金榖司奏課應遷格騰達當在茲元樞國士賞天子前席咨一言寤凝旒致主躋軒羲抱負經濟才凜然諫諍姿朝陽慶鳯鳴冀北空騧驪士為知己用素藴得盡施丞二須要劇臺閣未應遲需次指柯山買船泛釣磯暑行戒接淅江邉逺風披病夫困塵土倚玉慙葭枝分攜莫能送别酒何堪持儻經子陵瀨掃壁尋題詩前途得好句慰我别後思過分水嶺江南山盡處開闢如石門下有琴筑聲哀湍激箭奔殘雪護峯頂篁竹如四垣老翁僅百嵗曝背抱兒孫問之不我譍嗒然而忘言疑爾秦人徒此類桃花源寒日欲西頽不容駐短轅驅車下山去逼耳聞清猿回顧但煙靄路絶無攀援他年儻再逢共醉老瓦盆宿瑞巖示劉子厚肩輿轉緑疇跨浦躡石梁暮投瑞峯宿野色雜莽蒼魚鹽海市隘松竹山徑凉解衣借僧廬煮茗滌枯腸頓忘庚火爭秋色巳侵牀古戍此何夕冠蓋來徜徉一杯偶相屬荔丹咀氷霜哦詩興清絶天池看鵬翔卜居飛英坊束書辭都門整棹還苕川羈遊二十春寓農安一㕓家無卓錐地三挈囊衣遷移居古城隅開門枕漪漣容膝居易安環堵地自偏水竹慚履道風物異平泉掃軌謝奔競面壁參枯禪仰愧此坊名飛英馳日邉吾方師老圃樊須無間然何當畢婚嫁四十在眀年仙巖登覽造物藴神巧軒豁露真趣嵌空劃仙掌罅拆噴石乳半壁垂鮫綃晴天灑飛雨捫蘿不知疲酷愛巖石古彼姝逝杳絶靈虬孰能覩玉册閟篆籕三墳闕難補徘徊挹翠浪洗滌面塵土回輿帶夕嵐哦詩愧吳語慶陵季文尚書休致㑹者三十一人各賦詩尚書妙德望曵履聞直聲獻納雨露邉斯文有統盟重席侍經幄藻鑒持銓衡不憚推轂士規摹漢西京五色深補衮三入厭承眀歘起蓴鱸思徑作吳松行名位九牧聳富貴一毫輕徜徉霅溪上結廬依化城擺落軒冕纍白屋倒屣迎實際契禪宗虛靜合仙經聖朝亟圖舊世臣重典刑蒼生望東山鹽梅待調羮引年章屢却勇决非矯情雍容進退間夷惠和且清出綸冠奎文安車示尊榮樂天宅池臺翁仲金餘籯公貴無留資韓宣有卿名時方需大老復當佐升平它年秉旄地堂上有竒兵恢復還舊都翠華駕云亭賤子荷英盼鍊句愧陰鏗請歌公歸兮盍使季札聽移居僦屋東甌城爽氣挹西山颶風忽作惡柴荆不容關再徙得陋巷藩拔井亦眢稍畢塗塈功己覺容膝安庭前木亦嘉修竹才數竿幽豔海榴紅翠幄霜苞丹眀窗置棐几荒畦整藥欄兒曹頗解事掃徑見秋蘭鄰里來相賀知我非熱官使令勿狙詐辦此良獨難未祭孫寶竈且樂陶令閒今日我重九一酌還酡顔賦雪閶闔風勢叨朔雪夜方積窗隙散眀璣瓦溝露微白歡譁競兒曹局蹐愁病客漢淮鐡衣冷勦敵要長䇿安得郭代公英氣壓質勒又思李常侍銜枚擒蔡賊仰寬黃屋憂稍塞素餐責四郊正多壘萬室况艱食豈暇歌幽蘭但願豐穱麥早晚休王師奏凱獻酋馘桃花菊秋聲振窽木槁葉隨飛蓬起視籬下華灼灼夭桃容天公等兒戲小草發纎穠乍疑武陵源秦人儻再逢又如靈雲老禪機投劒鋒疇昔糞土廣靖節吾所宗不然薦墜露三閭挹遐蹤吕令載黃花鞠裳表其𠂻濁醪亂眼纈衰顔暫時紅肯效𤣥都吟葵麥搖春風七言古詩新交行君不見洛陽拜塵友欲取金印繫肘後又不見長安輕薄兒誰道青雲不可梯雨露翻覆豈無意炙手新交舊交棄華軒丹轂照青春列屋娥眉妬寵新若非大夫嘗便客亦是丞相拂鬚人車如雞栖馬如狗疾惡今無朱伯厚甘向青陵老種瓜肯效南山歌落豆直如弦死道邉杵臼論交世誰數翟公勒門吁可憐子清弟赴丹陽賦古調餞之酌君以烏程若下之酒贈君以魯山于蒍之聲酒以惜在原兄弟之别歌以見愛民父母之情大江襟喉城鐡甕萬旅連營地勢重天弧北射掃欃槍雲陽健令時方用從官四十腰銅章萊衣弄孫娛髙堂未妨束溼先馭吏立去敗羣如牧羊繭絲保障優租賦甌窶汙邪飽禾黍冠蓋使客應薦賢不日姓名徹當寧索别作惡殊匆匆呻吟病卧號秋蛩松竹讀書得新句緘題數寄北來鴻送錢進思倅吳郡繁雄茂苑侔漢輔森㦸凝香古佳處鵷鷺行除半刺賢萬井提封賴摩拊公家名德世有人伯仲于今見伊吕妙齡籍甚馳日邉粉闈握蘭將振羽胡為補外便親養知己家庭真內舉畫鷁鳴鐃催去程垂虹松江對烟雨西北髙樓插暮霞荷芰池光破炎暑平分風月助詩興一諾無事留公府却尋館娃歌舞地麋鹿臺荒盡禾黍劍池古色湛寒泉響屧採香迷島嶼仙鬼遺蹤杳茫昧臨賦餘情時訪古治中别駕稱展驥末俗媕婀譏越爼簡書獄市抵胡粵末界馬牛視齊楚欲了官事兒輩癡鉗柅吏欺租賦簿退食蕭然絶㸃埃亦有佳客酬談麈想席未暖詔巳頒穩上丹墀看布武故人貧病寄江湖一衲蒙頭參馬祖時憑尺素問沉綿臨别索詩愧吳語前行路難馮公嶺作君不見馮公之嶺摩蒼天危梁峻坂相屬聫樵夫跬步不得上仰視懸石勢欲顛下有飛泉㵼鳴瀑舂撞嵓竇滙山麓飛流濺沫冰雪寒蘿蔦荒林猿伏傍穿鳥道人蹤絶怪石虎踞蒼崖裂捫參厯井路屈盤九折羊腸車軸折如何年少逺逰子擔簦躡屩來過此或欲挾䇿干君王亦有辭家逺從仕馬痡僕倦棲茅屋夜汲巖泉燃楚竹賜璧封侯事渺茫塗窮未免阮生哭遐想太古開闢初地隔東甌擅一隅山腰鑿石自何代要令海㝢同車書不知馮公亦何者姓名宛與茲山俱我行適當三伏間霪霖積潦行路難家住太湖三萬頃煙波回想洞庭山和家叔察院巨魚詩滄溟浩渺浮寰區八紘九野水所儲介蟲族類信衆夥窮極詭怪堪嗟吁巨鼇屭贔冠靈島應龍連蜷頷驪珠異哉斯魚盈百尺失水安得波濤俱妖蜃疑遭旌陽縶長蛟端被周處誅井蛙不識東海若鸒斯寧信北溟魚聚觀堵牆駭莫辨妄意其名能自呼鬐鬛堅頑侔鐡角肌肉碩大爭翦除真成潜虬厄水㵝誰謂王鮪惟山居矧過屠門快大嚼况鼓庖刀砉投虛罔能深藏類谷鮒忽從變化同隙駒獨繭豈羡詹何巧巨犗還笑任公踈灘涘寄命在頃刻神龍魚服喪厥軀嗣宗詩成出月脅博考傳記搜祕圖餓氓殍腹屬厭幸臠取凌晨俄過晡老叨染指飫黿鼎里閭載酒行以車阿咸得句不敢出身同惠子方據梧暴殄天物古所戒志怪泚筆將特書題水墨羅漢大士神通超一切果成道備棲覺地龎眉山立孰寫真水墨良因作逰戲眀窗棐几㲲巾淨竹爐柏子香雲細絛繩乍解目增眀短幅溪藤聫數紙當年意匠寄髙逺慘淡風雲生眼底穹巖怪石隨步竒嶽鬼蠻奴凛生意僧繇未貌錦幪像道子曽罷長安市手攜貝多口忘言瓶瑩琉璃瞻舍利或默或語或慈威亦躡芒鞋將渡水天女獻供顔如蓮結習自空花墮袂神閒態逸讃莫窮墨妙筆精足珍袐蕭然著我巖壑中雁蕩經行恍能識詩成倒挽兩龍湫不用韓公為畫記松皮香鼎南山長鬛五大夫峩冠織翠華襟裾老藏山澤骨相臞捐軀鼎鼐計不踈偶向寒窗伴腐儒坦腹聳身止坐隅鼻觀如與芝蘭俱非煙非霧時有無愧爾不及清廟瑚竊䝉顧盼承吹噓彌眀不解世俗書啞然尚能賦此乎我慙劉侯敢詆渠眀窗晝永勤三餘三生結習痛掃除尚餘聞熏六鑿俱篆烟起滅凌太虛嗒然隱几兼忘吾憶雪歌前年吳興雪三尺街頭十日無行跡南山千峰蟠玉虬太湖萬頃鎔銀色腐儒凍死但長哦男呻女吟空四壁去年強鄰窺淮淝鐡馬成羣來塞北將軍授鉞橫雕戈雪滿弓韜對勍敵捷書夜到甘泉宫玉靶角弓自天錫已觀積甲熊耳齊坐覺洗兵天河窄今年臘盡寓東甌地接炎方少三白梅梢栁眼漏泄春笋茁蘭芽遽堪摘冬深未省見氷霜挾纊無施况狐腋朝來北風吹石裂海氣嵐烟亂山碧遐想瑞葉舞層霄剪裁不費造化力豐年一飽戴君恩比屋千家消癘疫長江逺近要舒發深恐陽驕無宿麥徒披鶴氅懷兔園速遣祥霙慰北客迎送神辭有序紹興戊辰夏五月甲子迄八月丙戌不雨武原之旱視他邑為甚河流既斷禳祈逮遍苗稼盡槁丁亥邑令余衍稽之衆議請水于烏龍井翌日水次縣十五里驕陽如焚隂雲忽興雷雨隨至民大悅置水佛祠緇素朝夕歌唄自是甘雨日以繼夜旬有二日四野霑足己未邑令率父老送神歸之按是廟稱蘇臯二王吳驃騎將軍蘇舉字子羽葬於武原宋髙祖嘗夢而異之封征南將軍眀帝載加冊命又吳地志云昔有牛糞金邑人臯伯與弟逐牛入山土崩壓死今邑南金牛山是也龍井之始或傳神騅跑地出泉因以為名事載海鹽圖經傳聞邑之父老祭法曰能禦大災捍大患則祀之惟神之靈距今千年廟食茲邑救此旱暵肸蠁如答是宜永崇廟貌佑我黎氓因採民謡作迎送神辭使嵗時歌以侑神惟龍湫兮其源莫窮利萬物兮精神可通嵗大旱兮我民之恫酌彼泉兮神聽孔聰擊鼓坎坎兮于神之宫薄采溪毛兮饋進兩公神欣欣兮鑒我民衷神之來兮雨其濛念我稼穡兮滌去爞爞瓶罌甚小兮膏澤甚豐驕陽摧威兮奔走豐霳民之謳歌兮千古英風右迎神旱既太甚神是籲兮一勺之水為甘霔兮伊神正直歆誠愫兮三日為霖彌旬注兮我稼既興舟在步兮微我兩公余曷訴兮擊鼓其鏜山之下兮桂酒椒漿餞神去兮功成惠孚去不顧兮擕幼扶鮐民塞路兮卒相有年多黍稌兮澤惠無忘永終古兮右送神和柯山先生讀中興碑曲江罷相迹如掃滿朝媕婀無諫草動地漁陽鼙鼓驚舊將半死哥舒老蜀道乘騾萬里來不識平原濟世才倉皇靈武送玉冊豈顧九廟䝉塵埃天開地闢扶皇紀李郭功成安史死一日三朝有深意臣結胸中老文字麻鞋詩老脫賊來北征自足配磨崖我思瀟湘不易到誰持墨本心眼開鑒古評詩增感慨無逸圖亡山水在君不見阿忠少日厯艱貧湯餅曽持半臂賣送徐致州交代賜第歸親庭九五飛龍闡文化眀光親䇿穿楊射重瞳左右列臯䕫鵠立臚傳玉階下乙科首冠持橐門衣鉢家聲傳子舍扶陽一經世青氈天語褒嘉增寵假衣冠盛事耀儒紳馬走牛醫皆衒咤君才端合連八科麗藻眀璣美無價他年落筆中書堂更分跋燭金鑾夜詔成速招贊普朝感動寧須奉天赦乃翁東山傾士望內集風流繼諸謝買船徑度子陵灘不待瓊林霑玉斚謂言歸心馳寢門戲綵趨庭及槐夏顧我慚稱李耳孫冗散時遭官長罵效顰纍月漫笞兒行矣歸田老耕稼題戚仲騾綱圖北風吹雪飛千山雪深山徑難往還長林喬木斂秀色層崖疊嶂雕蒼顔山腹癡雲結寒潤山巔去天不盈寸溪湍岩瀑爭喧豗獸蹄鳥跡皆逃遁中有驛使輸皇綱羣騾任重人束裝旌旗不展嵐氣濕鞍轡穩馭鑾聲鉠危橋當道不可過怒揮鞭箠驅慵惰棧閣縈紆鐡勒寒荆榛暗刺氊衣破騾行迢遰風蕭颾倦來誰復鳴鞭梢忽逢大渡凜毛骨深沉時若潜虬蛟作急呼舟渡斯水尋得舟人來數里一舟已去一舟行掉入深潭浪花起舟移岸曲人爭先牽騾束貨行揮鞭蘆深峽束積雪滑十步九止愁其顛騾行隤敗人􅑎腹民家借爨黃梁熟人餐騾飼幸平恬其奈門前去程促山前山後開梅花卧溪枯樹寒槎牙關情一片青煙下深閉柴門三四家行行漸出平川路回首千山暝雲霧自知驛舍更一程指㸃山坳深處住解鞍摘貨驛舍寬地爐榾柮煙辛酸羣騾入廄人飽睡眀朝一驛可輸官絹落并刀慳數尺衡從筆墨開胸臆盡將此景作此圖輕描濃抹無凝積古來摩詰傳天真此手那知復入神好將一本獻天子能信邦家本兆民菁山觀梅歌菁茅山底梅花村無人惜花與招魂西子猶疑逐范蠡玉兒寧肯負東昏數枝含愁月邉吐似隔鮫綃向人語欲欣江南萬斛愁一笑嫣然絶媚嫵道人買山今幾年山髙春早花爭先開門幻出香世界坐覺孤山落案前東皇萬里開彊域掌中菴摩妙喜國喚取維摩方丈人問我本來何所得隆興改元初余為永嘉監倉時登忠義堂覩顔魯公像知其裔家是邦今閲一紀沿檄莆中遇軍事判官邵即其人也因請觀常山平原二像并大厯皓㑹昌嗣二誥為賦長句眀皇不識顔平原我觀舊史心慨然天寶末年事大錯邉將騁兵相盜權忽聞漁陽鼓鼙震二十四郡城無堅霓裳驚破西行蜀妃子倉皇死馬前常山平原乃昆弟屹立砥柱摧腥羶土門既失陷河朔天津罵賊鬚髮拳嗣皇靈武實草創獨坐鶚立中興年尚書纍月家食粥諸將列屋羅妖妍嗚呼千載慕亷藺曹蜍李志如九泉莆陽幕府東嘉客飽聞裔孫家好賢錦囊重覩忠義像再拜恨不為執鞭輕綃盈幅凜生面髣佛冠劍躋凌煙况藏二誥墨色古吾宗贊皇相業傳憐君為米走塵土七十青衫雪滿顛乃祖精爽跨箕尾寄書入洛逢飛仙莫春過吳松垂虹用聞人伯封韻具區吳松同一水季鷹英靈呼不起波平風靜落日眀一碧青銅三萬里幻成水墨思范寬㸃綴卧虹排雕欄曜暗楓林帶煙雨白鶴飛去何時還老子登臨屢春晚胸吞雲夢極荒逺鞭笞鸞鳯恣遨逰幾日蓬萊又清淺何時膾鱸平波秋湘娥鼓瑟纎指柔却跨玉虹朝汗漫誰能直釣無垂鈎
