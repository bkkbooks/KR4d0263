body:
  text: 提要芸菴類稿六巻别集類三宋臣等謹案芸菴類稿六巻宋李洪撰洪姓名不著于史諸家書目亦未載有是集惟永樂大典頗散見其文又别出陳貴謙原序一篇稱洪為李正民之子又稱為藤州使君知洪官止知藤州集中又有扈從朝德夀宫景靈宫詩則曾為京朝官有在温州題其父手澤詩稱嗣子守官於此則曾知温州其他不可復考矣正民本揚州人南渡後僑寓海鹽故洪集中如烏龍井廟迎送神詞之類皆在海鹽所作而卜居飛英坊一首乃云束書辭都門整棹還苕川則洪後又移居湖州乃兩郡紀流寓者俱不及其父子則由遺集散佚徵文獻者罕及也洪所作詩雖骨榦未堅而神思清超時露警秀七言律詩尤為工穩足以嗣響正民陳貴謙序稱原本二十四巻而今所掇拾僅得詩詞三百九十餘首文三十首視原集祗十之三四亦云僅矣據所存者釐為五巻而以雜文一巻附之畧具梗概俾不致終就泯沒焉乾隆四十六年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀原序大隠先生李公侍郎諱正民在中原時以文章名天下渡江南來扈從巡守參為名命條畫軍國大計于艱危時最號忠力諸所論撰亦既盛行于時其子藤州使君諱洪則有芸庵類稿二十巻貴謙得而讀之因竊有歎昔者士君子之學皆以養氣為本文章者葢氣之所寓而氣非専于為文也侍郎君殁且八十餘年讀其文凛然猶有生氣若使君所著該括衆體每于草木鳥獸之微有可寄興以為忠邪賢否之辨者未始不反覆致意仰冦萊公之忠大顔平原之節慕陶淵明之隠斥盤谷李愿之汰而知韓子有為言之也其視前所謂凛然者似之非耶夫長江大河迤延浩汗雖其包納深廣要亦發源之逺與衆水異爾古之人不以著姓世禄為賢而以立功立言為不朽葢謂是也使君長子吏部直養嘗以使事至襄陽兵間風績甚偉次子直柄今守湖南望郡有治理行見世其家者殊未艾也觀是篇者又可以知其傳矣陳貴謙序
