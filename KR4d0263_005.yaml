body:
  text: 芸庵類藁巻五宋李洪撰五言絶句過分水嶺江南山盡處兩山如石門溪流湍激雪殘日雨猶存回文病卧愁花落春深怨夜長鏡明羞短髪窻净惜殘香六言絶句題慈感寺極目軒紅芰敷腴獻笑青山偃蹇横陳身在水晶宫裏須信羲皇上人寺枕苕溪一曲僧依城郭千家客至未嘗芡觜我來恰及荷花塵眼登臨清曠水心樓閣峥嶸欲見普門大士菰蒲影裏鐘聲范至能遊靈石録示詩仙留題云南塢數回泉石西風幾疊烟雲登攜孰與為侣顔禹李甲蕭筠鼎峙傲睨絶景揮毫想見凌雲落落真筌玉子歩虚寧作吳筠勝槩風生步武山靈景從歸雲塵世欲尋飈馭藤陰萬箇蒼筠雨後泉淙水樂詩成目送孤雲寄興西湖南北忘年丘壑松筠戱題世事悠悠豈盡人生汲汲多端陶令欲歌歸去貢公何事彈冠多病閉門懶出避喧終日髙眠惟可以君命竹安能以兄事錢七言絶句登瀟灑亭文正風流尚典刑桐江畫㦸見詩人丹青難冩真瀟灑圓嶠方壺此逼真殘春偶作溪邊且種刺史栁園裏未栽懐縣花若有故人來問字浮圖西畔緑陰斜閒裏光陰趣漸長下簾深護一鑪香逰心華藏衆香國絶勝争名翰墨場周堯夫示秋懐詩然公方為貴恙所撓因以箴之伐性蛾眉賈禍長何如鈆鼎養中央應憐剌剌出門語苦怨寥寥秋夕涼宿湯泉驛炎方到處水如湯地脉深疑有臭黄猶勝驪山汚艷質漁陽簇馬鑒興亡題謫仙回舟卧披錦袍圗太白狂歌一酒船錦袍夜醉楚江邊此時應向剡中宿逼耳清猿月滿川和人松江塵纓快濯四橋水曵履却上三髙堂欲按新圖買漁具短蓑篛笠混行藏去年春盡西湖上把酒看山聴澗泉今日松江烟浪裏平分詩思入漁船以雪梨遺韓子文婺女新梨玉雪如姑山綽約想肌膚使君應喚纎纎手飣座風流近酒壺老人亭夢中已識雪髯翁線去絲來信不通覿面相呈了無得巖前萬竅自號風即事寶䇿歡傳萬嵗聲塗山執玉萃華纓獨憐太史周南滯不預堯階賀太平苒苒殘年白髪新可憐蹭蹬老修鱗坐觀溝瀆尋常困未使揚鬐化若神塗中雜興畏日炎炎火傘張扁舟挂席泛滄浪飛流濺沬傾三峽過嶮方知有底忙草間蟋蟀動秋吟偏感羇栖旅念深功業豈闗雙鬢事年來白處已通心很石驚濤枕席喧長江蛟鰐屢垂涎早知行路難如此何似修塗穏著鞭荔子如丹橄欖青紅蕉葉落古榕清温湯浴罷晚風快老酒傾盆醉月明山顛恠石如蹲獸波底危磯似化羊却憶鑑湖明月裏緑荷紅芰暑風涼釣臺故人澤畔被羊裘髙挹中天㑹冕旒不使客星侵帝座謾誇拜衮與封侯古木陰森蔽釣臺蒼崖石壁倚天開當年童稚曽逰處十八年間復此來偶書世事悠悠莫問天一觴且醉酒中賢階前落葉無人掃滿院芭蕉聴雨眠騎騾留城鎮無馬羌騾相送留城北去去分騾冷笑親朋駟馬多頼得勁蹄無可礙一鞭安穏過沙河過張司空廟昔人博物豈虚傳自斸龍泉古獄邊今代司空應見慣斗間何用氣衝天窾木詩􅑆木饕風耐嵗寒輪囷入用固知難不才果得全樗散且伴幽人澗谷盤道中聞啼鳥翠陰叢竹轉山腰忽聴一聲婆餅焦想見故園春社近杏花消息雨連朝富沙城外李花盛開萬石灘頭數十家溪流衮衮麥畦斜三分春色今餘幾開盡桃花見李花題安頭陀石室頭陀靈迹閟巖隈尋勝何人肯暫來野鳥銜花無覔處緑苔封逕看空回和鄭康道探梅十絶句國艷氷姿非世粧忍教臘雪苦韜藏昔年曽醉萬松嶺尚友詩人蘇與黄學詩少日賦梅花詩老忘言借齒牙媟語滛言漫元白單傳衣鉢勿矜誇雪後蒼茫立水濵香膚不粟自生温南枝鍾美知春早未使蠻烟蜑雨昏獨秀娟然寄一枝江南嵗嵗臘前開綴椒未見封條雪應誤揷花晴昊來夜寒池面結氷花誰識吳姬張麗華待到黄昏斜月吐暗香踈影屬林家石腸底事鬬清新賦就摛華萬象春誰知袖手苦吟客中有築巖和鼎人多病年來嬾作詩燃萁何敢衒才奇探梅技痒撩幽夢只有清香是已知萬木凋枯一笑春未應蘭芷伴騷人東風桃李皆奴僕我軰論文未厭頻瑟瑟清波溪澗寒屬聨詩筆不當慳請君更艤菁山棹萬斛愁侵山復山吟到梅開醉不休十詩刻燭冩蝇頭須知老匠能雕句月仄金盆獨倚樓紀行雜詩鸕鷀源畔數人家匼匝青羅布障遮胥口山前沽酒市釣􅊑相逐買魚蝦水宿荒村夕照間奔流怪石鬬潺潺白醪似蜜聊供醉過盡嚴陵大浪灘蒲颿風駛送行舟篷底哦詩相棹謳三老相呼興不淺溪迴山擁近嚴州支流二水繞山城瀟灑桐廬舊得名好在鳥籠山靄裏眼生詩句易詩成髙桅一一上灘船流汗頳肩盡日牽笑憶太湖波上宿雲濤無際欲粘天石鏬飛泉鳴佩玉灘頭怒石響驚雷故人相見應相笑愛底微官觸暑來仁實分柑仲躬餉碧泉各賦一絶一别温江九換年賞柑籬落綴青圓羅浮貢篚無因遇林下先嘗愧謫仙寂寞東籬嗅落英淵明止酒任天真江州無復王宏惠一斛葡萄頼故人清明鑚火烹茶客舍垂楊依舊青自鑚新火應清明故山紫笋誰能摘倒篋雲龍手自烹鷄菜嶺烟雨濛濛不濕衣春風欺客逞寒威籃輿無著新愁處小酌村醪款竹扉龍井無熱龍宫此道塲人天瞻禮玉毫光璽書重疊兩朝賜更助吾皇節雨暘題崇福院壁十邑驅馳閱四旬盡空囹圄報吾君僧窻漸覺猿吟逺城市囂塵自此分秋祀上丁齋宿中夜雨涼因思去嵗氣候頗同書壁秋雲黯黯結層陰頖水人稀夜漏沉獨有芭蕉如道侣二年相伴宿齋心書寓舍壁且卧元龍百尺樓難忘江海一扁舟西山爽氣助詩興忽有碧雲生暮愁沉陰未解雨濛濛倚檻看山怯曉風睡起賣花聲過盡不知春色在壺中黄碧軒臺鑄鼎已飛昇留與仙祠萬古名羽駕霓旌鎻深翠無因暫聴步虚聲紅蕉舊館彤雲誰解賦朱光緑潤感遺芳詞人自古傷流落安得移根貢玉堂清暉亭溪山佳處稱題詩終日籃輿繞翠微夾路蒼官管迎送客情那得澹忘歸龍爪瑞花嶔崎石壁倚長松古䜟今觀龍爪紅何事偏私閒草木狀元家住嶺西東喝石巖信脚來游喝石巖老來到處少同㕘出家本是丈夫事嵗晚終期卜一庵宿鱸風亭暫解塵纓鎻與韁鱸風秋色似鱸鄉從今第四橋南去蟹籪漁磯屬漫郎題朝陽亭新亭危冠别峯西萬壑千巖勢總低要使登臨髙著眼梧桐應有鳯鳯棲偶作不種松陵二頃田却來江浦按戈船乗風破浪非吾事暫借僧窻永日眠十日王程未許歸登山臨水此心違夜䦨佛屋龕燈暗時有飛螢㸃客衣小雨纎纎未肯晴歸程猶趁欲宵征潮來江浦緑如染雲抹山腰練許横送許季韶倅桂林二年鞭弭侍君軒立㐲從來愧不言乞得閒官九仙隠身謀優穏荷明恩髙枕秋風病骨輕隨鑾無復起侵星銅瓶潄井銷塵慮舌本猶堪讀道經除墨猶新濕詔黄題輿不稱愧龍光且觀百粤蛟鱷徙勿羡九霄鸞鵠翔文登猶記舊青氊敢恨𤓰期尚六年辦取扁舟五湖上吳松魚蟹不論錢宣和末先公嘗倅登倦雨留滯都城日欲歸江昏雨脚又霏微秪愁隴上麥蛾化豈要枝間梅子肥聴雨軒四首春到池塘草自青飛花時度破窻櫺恨無好句追顔謝頼有鳴蛙鼓吹聴脫帽風簷迎晚吹催詩急雨喚輕雷秪應荷氣薫人醉不用輪囷象鼻杯聴風聴雨江湖上一葉輕舟檥釣沙暫却鶩行容退食秋聲先已到枯葭天寒病鴨守氷池折葦枯荷霰雪飛不覺哦詩成獨立南枝的皪露春機南塔别峯相見路非遥指㸃錢塘一線潮安得南山退之句賦成直使意飄飄和子永韻林樾交陰閙雨鳩滯留已敝黒貂裘却思把釣江湖上萬仭蒼崖揷碧流和寺丞叔賜對親奉玉音叙及家世韻心存魏闕江湖逺歸覲重瞳日月明遥憶五倫思一見豈詢宣室鬼神情烏臺鳯沼承親擢尚有孤忠簡聖明大雅一門時鮮儷急難尤切在原情坦庵僧名崇彼萬象森羅具一塵小庵花木四時春客來相對黙無語親見毘耶彼上人國一禪師塔蓬徑安禪五百年六時鐘唄震諸天我來不問安心法露柱風林說熾然和人楊栁踈踈已報秋月華如水浸階頭惜無畫手王摩詰貌取中宵一段愁池面粼粼已送涼小窻危坐聴風篁不應尚厭秋來熱已减炎天五刻長庭前槐樹緑陰陰静聴𤣥蟬盡日吟枕簟虚涼清夢境了無俗物動禪心夕陽返照樹頭明天外虹收放晚晴洗盡塵埃初雨過一蟬飛入緑槐鳴題潘岳擲果圖錦繡文才貌甚都冶容亂擲果盈車披圖冝鑒登徒子折齒猶勝謝㓜輿雙桱古杉翠桱幾千章勢壓穹巖九暑涼匠石它年選隆棟萬牛回首立明堂朝拜羅源天慶即洞宫福地也徐仙何代此飛昇洞府空留福地名我到朝真效三祝步虚聲杳俗縁輕普照菴小憩昔日牧童聚沙戱若箇阿師來卓庵千聖路頭都把斷不須辛苦誤同參飲桂香茶簡翁及甫午睡初醒緩注湯一甌清露沃詩腸疑君昔日探蟾窟猶帶天邊桂子香游武夷二絶平湖高栁緑千堆莫為尋芳取次回欲訪同㕘徳雲老别峯霽色夕陽開野水溶溶易滿堤十分强半麥成畦我來宴坐久無語日暮春深鸎亂啼池中雙鴨甚馴籠贈古靈陳仲雙鳬蕩漾小池幽荷葉田田兩見秋却恨主人官滿去荒陂野水狎輕鷗飯餘臨檻數龜魚蛙黽跳浪亦任渠籠寄雙鳬古靈去不因羽客換鵝書智仲可化盗圖有徳由來必有隣得齊潜徳感人深不勞渠聴甘棠訟解使偷兒自革心同子永和貝元復春日韻平生身計拙如鳩更向周南怨滯留無奈春風欺客病蕙蘭狼籍伴牢愁偶訪東甌謝守家池塘春草栁陰斜遥思上下登山屐不為溪頭桃李花村村春到野花開蠻榼紅醪盡醉回客子哦詩驚節物林端杜宇不須催杏雨桃鬟一餉紅楞伽三昧舊家風江南江北松楸逺淚眼昏花瘴霧中題羅源驛用馬駒甫韻今年小稔徧山村白叟黄童笑倚門老瓦為樽賽田祖石田多稼慶曽孫日斜投宿古禪扉老宿過同東院西到處葛藤無用處試尋梅萼亞疎籬過婺港已辭悍石嚴灘險稍快平波婺港行夜宿喜逢漁酒市南風拂面月朧明劒池削成峭壁碧孱顔石罅髙臨毛髪寒我有胷中一寸鐵湛然如水絶波瀾謁皇甫清虚五湖四海仰儀形道貌天真孰可名偶泛僊舟來澤國回先生後見先生含暉亭𣺌𣺌曦車暘谷升東封日觀未容登山僧更約中宵看列炬煌煌現聖燈喜雨京塵眯目厭黄埃蕭颯風櫺聴雨來心似芭蕉半憔悴喜聞蟄戸一聲雷題鴈蕩圗寄二兄誰知歸鴈亭中客鼓翼來遊鴈蕩山更寄鴈圖憑鴈足秋風孤鴈苦思還夜坐驅蚊無術但􅎲膚燈火無因暫映書半夜西風吹急雨芭蕉聲響竹蕭踈梅寂寞吹香野水濵霜蜚月墜倍精神横陳故作臨窻影妙韻誰云畫逼真夜泊第四橋月淡波寒夜向分斷行孤鴈不堪聞扁舟第四橋南泊無限清愁寄夢雲再至義泉院蘇才翁題曰鳯翅泉不令辛苦登螺嶺再挹泓渟嗽鳯泉客鬢自憐塵土滿嶺松崖竹飽風烟丹桂盡開因思去嵗從駕宴賞之盛清蹕當年從紫皇絳霄丹桂進霞觴夢回猶記鈞天奏一簇紅雲繞赭黄次子都兄借楊凝式帖韻空傳狸骨與鵝羣惟有闗西筆可珍鑱刻所存猶勁健歐虞信是捧心人前朝惟有楊虚白心畫心聲獨擅功身縶南冠懐洛寺恨無北客話髙嵩楊李書名五季間江南勁筆儉而寒臨摹更陋唐人筆不脫蘭亭舊界闌和林尚善讀子雲傳夢得詩韻尚白寧堪衆楚咻井湄缾碎愈増愁後人歸罪美新作莫汙蕭郎文選樓君子惟宜以懿文後生輕進附僉人竹枝空有蠻歌怨争似當年略轉鈞用東坡回文韻春晚落花餘碧草日長舞蝶妬紅蔫新荷捲翠簮池面弱栁垂絲織暝烟詩餘木蘭花幔秋意占西風早處一畨雨一畨秋記故國斜陽去年今日落葉林幽悲歌幾回激烈寄踈狂酒令與詩籌遺恨清商易改多情紫燕難留嗟休觸緒繭絲抽舊事續何由奈予懐𣺌𣺌羇愁鬱鬱歸夢悠悠生平不如老杜便如它飄泊也風流寄語庭柯徑菊甚時得棹孤舟滿庭芳木犀香滿千巖芳傳叢桂小山曽詠幽菲仙姿冷淡不奈此香奇翠葆層層障日深愛惜早被風吹秋英嫰夜來露浥月底半離披誰知清品貴帶裝金粟韻透文犀與降真為侣羅袖相冝寶鴨休薫百濯清芬在常惹人衣姮娥約廣寒宫殿留折最髙枝滿江紅和鹽田驛駒父留題梅雨成霖倦永晝暑行巖曲愛雲梢翠樾枕谿篷屋輕木凌波衝巻雪飛泉犇壑鳴哀玉羡漁翁終嵗老烟波披蓑緑嗟客宦荒松菊頽壯志青編竹更長年諳盡是非榮辱鐘鼎無心時節異山林有味簞瓢足感故人於此賦歸歟思之熟南鄉子鹽田渡掛席泛安流細雨斜風到渡頭萬叠雲鬟真似畫雲州自古詩人幾箇游旌斾去悠悠别駕無功愧食浮却憶五湖烟浪裏扁舟第四槁南雲水秋鷓鴣天送客至湯泉十月南閩未有霜蕉林蔗圃鬱相望壓枝橄欖渾如畫透甲香橙半弄黄斟渌醑泛滄浪白沙翠竹近温湯分明水墨山陰道只欠氷谿雪月光西江月送客石岊亭𣺌𣺌長汀逺壑蕭蕭雨葉風枝幾回臨水送將歸客裏暗添憔悴門枕數峯滴翠舟横萬疊漣漪緑秧深處鷺于飛愈覺田園有味菩薩蠻寒山横抹修眉緑樓前溪瀑鏘鳴玉車馬各西東行人如轉蓬欄干成獨倚海濶天無際雲淡隔壺山鴻飛杳靄間浣紗溪梅菁山遇雪夭矯翔鸞溪上峯飄蕭雪霰打船篷天花凌亂水晶宫飛透紙窻斜取勢吹回溪面舞因風身遊水墨畫圗中前調山中清明後一日大雪碧澗蒼崖玉四圍東君剪水散明璣半開桃杏不勝威疑是羣仙遊閬苑歌雲舞蝶鬭髙飛珠幢玉節送人歸前調暮春掃地燒香絶㸃塵縁堦緑草又殘春略無閒事撓天真時落燕泥沾几席亂粘飛絮上衣巾西湖回柂少年人
