  - {type: page-break, offset: 0, content: '', id: KR4d0263_WYG_004-1a, image: WYG1159/WYG1159-0103c.png}
body:
  text: 芸庵類藁巻四宋李洪撰七言律詩叔賜迎侍以詩餞之且趣其來折檻雲孫擅後聲暫棲蓮幕不談兵論詩更欲壓競病痛飲何須分濁清東閣梅殘縈旅夢北堂萱茂動歸情重來肯放韶光晚叱馭加鞭莫計程僧惠白蓮逃暑追凉蔭碧蘿清池咫尺阻經過眼前喜見芬陀利鼻觀重參乾闥婆綽約漢宫黄傳額依稀洛浦韈凌波逺公自結廬山社一笑拈花意若何拄頰㸔山暑頓空修眉横嶂障晴空太真姊妺温泉浴竇氏兒郎丹桂風古驛荒凉征騎速里居好事古人同明年更有秋風便淡墨聯名冠法宫寒食懐西湖去歳遊從去年寒食醉西湖山色空濛暮有無風急落花隨步積雨昏垂桞要人扶偶携勝友尋泉石俱有新詩入畫圖越絶故人應念我明年春好㑹皇都和叔賜對榴花安石榴開夏已深動人絳萼緑成陰色空喻火宜知戒伐性如斤莫浪侵半吐蹙巾傳麗曲同尋雙葉寓歡心老來體物辜詩興種種霜顛媿玳簮送子都兄赴建康糧料三首三年待次喜𤓰期别酒春風勸一巵欲試發硎稽古力稍從連茹中興時徒勞人耳猶州縣可識荆兮復别離深念對床聽夜雨情懐作惡不成詩留都萬雉最繁雄人物風流古所同玉樹玉笙亡國恨桃根桃葉刼灰空重新觀闕青㝠外依舊山川王氣中好把清吟追太白龍蟠虎踞美江東霸業衣冠事莫論秦淮潮汐自潺湲新詩必有江山助故國應無喬木存宅施雞園鍾阜逺塔蔵鳥𤓰道林尊登臨懐古情何限想對三茅憶弟昆伯封同遊霅上事畢遽索别次韻同來我復似鄒遊新詠君應勝杜秋已飫蒸葫汝南饌盍為麄糲浣花留殘樽且醉菖蒲酒去棹聊停杜若洲不厭村居能少駐蘭香萬斛頓銷愁春晚疾後臨眺遊絲横路網春暉落絮飄揚未肯歸緑滿郊園梅子熟晝長庭院燕雛飛登臨供賦山分繡扶病經時帶减圍更向江天買魚具輕蓑絶勝芰荷衣次韻陸子望欲假家集先子詞科蚤擅塲中興首擢紫微郎湧泉制冊留綸閣砭世膏肓有皂囊北斗仰之千古事泰山所集一毫芒楹書拂拭増悲慟追誦龍蛇感卒章陪朱徳應泛舟乘興揚舲意未窮俊遊真有古人風朱陳親契當年少李郭仙舟此日同山色逺看空翠裏笑聲髙徹水雲中賢關求士方虚席得雋行聞冀北空聞季叔被召小詩為迓郢人比屋慶循良忽捧絲綸雨露香騎竹方迎使君馬賜環已趣舍人装好刋棠杕追嘉頌應有陽春播樂章歸侍玉皇香案側願將五色補垂裳簡月闍黎吏隠他年並海漘倦游悔現宰官身誰知西子湖邉寺重見東林社裏人堆案楞伽三昧勝談經優鉢一花新老來無復論詩樂政欲相從寂寞濱送野上人遊西山詩名翰墨獨兼全海上從游十許年進退兩忘中有徳律禪不礙任隨縁岫雲又作無心出桃塢何勞一笑妍好把經行寫新詠他時寄我小山篇贈妙源上人輟􅊰卧禪庵萬論千經思盡覃未與釋迦分半座只應彌勒且同龕兎甌潑乳清塵慮麈柄揮犀發妙談我亦乘間聊問道安能遺世學瞿曇送薦福恩老二老相從寂寞濱往來藜杖特情親白頭廬阜閒司馬杜口毗耶彼上人知見普薫金斗域伽陀語别霅溪瀕紅梅已露西來意要㸔全提祖令新送隨公蓮社談經閲㡬年住山活計儘隨縁銜花百鳥未忘物露地白牛誰着鞭得計深居飡老栢勿疑古澗與寒泉他時要伴芸庵隠竿木逢場不離禪贈思溪覺悟寺凈因師思溪渺渺泛蘭舟檥棹臨津得自㽞蓮社不知三伏熱竹林獨占一庭秋蒲葵喜接髙人語茗盌能消旅客愁所恨塵縁驅逐去漫㽞名姓記曽游贈法傳栴檀林下老支郎偶汎溪邉般若航齋鉢分摶香積飯午忩對卧凈名牀雲山宴坐千春木庵名靈椿塵境難㽞三宿桑欲結他年蓮社友空門氣味覺優長宿天寧示􅴇老又扶殘醉渡溪橋飲散南園夜寂寥炬火照山疑犯斗松風動地欲平潮觀河自嘆塵容老就日那能鬢雪消煨芋擁鑪談妙道階梯佛祖直須超和子召見寄獨泛滄浪一釣舟未償尋壑與經邱霜清叵怯吳江冷酒賤難從越女留遊鹿䑓荒人既往採香逕逺宿湏投客遊空羡齊雲勝辜負韋黄詩酒州和尚善韻出郭尋幽興自長叢林梅子未全黄問禪欲契風幡話宴坐聊參知見香觸念未通成繫撅安心無法是還鄕却憐石岊送迎處潮落潮生有底忙再用韻風罥遊絲百尺長蜂房醸蜜露微黄翠榕一半委陳葉紫奈十分㽞暗香盧橘帶酸歸老圃側生未熟去閩郷浮雲出岫初無戀靜㸔巻舒何太忙和仲信㽞别韻歳首相逢四序遷風饕雪虐忽凋年少而慕藺心何壯老矣依劉誰復憐邂逅難陪十日飲分擕却上五湖船雪梅可折還相送目斷離雲思黯然送趙徳莊右司江東漕二首帝胄英英秀本支名駒千里衆難睎馳聲小選衣冠地振職中䑓政事機禮樂光華持節寵綸恩獻納賜環歸朝廷俊傑如公少凖擬重來伴紫㣲宰士雍容望最優便期簮筆侍凝旒暫勞省戸彌綸手稍緩關中饋餉憂寓直文謨髙内閣褰帷仁政被南州龍蟠虎踞登臨勝天險防邉得細籌伯封書中叙去歳七夕之樂因寄去年此夜對芳樽今日栖栖歎失羣茅屋只餘燈伴我酒爐應有月尋君愁將從事青州去風共禪師白足分料想紫梅溪上客也應回首一㸔雲送仲彌性赴蘄水中興岳牧任詞人分虎初班楚澤春四紀才名文價重一麾江海璽書新眷深丹扆虚前席祖意黄梅試問津報政寧需外庸訖遄歸清禁掌絲綸午日寓圓果院苦河魚以詩紀節老來百事與心違節物殊非少壯時細葛宫中曽被賜楊梅粽裏未容窺浪求醫國三年艾空弔沉湘五色絲蕭寺更同摩詰病玉堂帖子要新詩送滕彦道赴浙東參議輟自鵷行第一流笑譚幕府卧青油蘭亭陳迹猶堪賦禹穴竒書尚可求丞相開藩多暇日省郎為介借前籌獨憐無用溝中斷深羡千巖萬壑遊陳丞相誕日鳯紀千齡遇聖君扶持宗社不無人欣聞東魯真儒相本是中興舊學臣玉燕投懐文冠世天麟呈瑞夀嘉辰中書更倍汾陽考宰枋重歸轉大鈞壺山和氣儷神崧間世鍾賢應尹躬小試經綸安鼎鼐更恢韜畧靖華戎力陳致主千秋鑑夢恊遐年八十公不用安期覔𤓰棗蓬萊清淺照方瞳蟬冕金貂侍帝廷格天勲業不譚兵曽聞楊綰無榮利果見周公致太平晝錦歸來安緑野宣麻重起繫蒼生民歌有衮巖瞻切要使輿圖復兩京兩兩台符逼斗魁就盈彌月早春回細斟靜治曹參酒重放和羮傅説梅山立時行錫難老鸞停鵠峙喜多才千鍾未足為公壽盡挹滄江入壽杯衮繡于蕃鎮九僊香凝森㦸靄非煙願同吉甫頌申伯請繼東坡壽樂全銅狄摩娑五百歳蟠桃花實一千年蚤窺東閣觀竒士再入陶鎔豈偶然送子南兄參選我李柯條世有人如兄器業自超倫豈容被褐常懐寳好上煙霄早致身天氣未佳欲寒食朝廷有道政青春觀光勿作遲遲去桂玉何勞嘆楚薪雨寒昏昏海氣助朝寒風雨蕭蕭盡日間室似陳蕃塵不掃門如陶令晝常關惟慿茗盌消磨睡更把詩筒斷送閒悄悄絶無車馬至方知顔巷似深山至東林謁回仙人像罨畵溪山杳靄中為尋遺事訪禪宫回嵓故迹依然在渭水非熊恍似空緑薜侵衣餘手澤遺榴輝壁想仙風溪邉東老家何處尚有孫礽話乃翁次韻曽仲躬初入鴈蕩阡陌經行早布春承明天語耳親聞詩情本自凌康樂墨妙何勞法右軍雪後西岑山競秀潮來孤嶼浪中分蘐堂扁榜名仁壽鴈序娛親羡使君池水久涸雨後生蓮偶作遶郭荷花泛畫船枯池忽見葉田田艱生頗似石間柏罕喻真成陸地蓮要㸔露香明菡萏不辭汲水弄漪漣况逢小雨臨清曉已見瓊珠碎又圓次韻林子長巖桂凉入千巖趣更幽廣寒月府恍神遊斷崖流水韻清古冷雨凄風聲凛秋要補離騷衙宋玉豈期仙袂挹浮邱却思勝集湖邉寺搴取芳枝鎮日留賦丞㕔連理木老槐鉅竹儼墻陰斯立詩情冠古今連理並柯真創見澡身浴徳信同心蟬吟永夜傳清韻鶴唳中宵和好音不日除書下丹禁瑞圖頻展錦窠深赤目元晏先生病久妨經旬未省下禪床瞿曇善説空華喻張湛新傳損讀方對客不須分眼白愛官寧復羡腰黄會逄妙解金箆術漸恐封疆限醉鄕再賦簡李尉滿院秋英獨傲霜恨無醇酒變春江門前催取麻姑榼席上驚傾道士缸學蹈丘軻難合俗詩如曹鄶不成邦埋蔵自比豐城劒射斗難占紫氣雙子都兄寄子濟兄詩借韻奉寄緘題千里候寒暄悵恨郊荆獨我班目斷檣烏五兩逺書慿河鯉一雙還金陵風月供吟嘯鍾阜烟蘿想縱攀盡把錦囊新詠句小胥抄寄勿令慳子都録示近作成白體一首奉寄别日江梅半透春梨花開後獨愁人欲將芳草萋萋恨寄向滄江六六鱗兩處吟當㸔雪夜數篇抄值落花晨未輸謝客池塘夢千里𢋫酬句要新寄沈時仲故人為别又經年㡬度臨風思黯然赤縣暫陪珠履客青衫空負小山篇壯時之武無能用老矣揚雄只守𤣥何日西湖追舊約淡煙踈雨泛湖船論交肺腑獨深知手札勤渠慰我思郭泰墊巾頻念舊休文减帶最能詩常懐勝集無三友坐想髙談彼一時明月扁舟過苕霅蘋汀重理釣魚絲次韻子詠弟見寄春殘逆旅賦歸歟桂玉囊空欲趂虚懶效梁鴻五噫曲未逢黄石一編書刺漫屢簉門行馬志拙寧堪鼎拄車數畆荒田臨霅水好披龍具去携鋤次韻陸元量見寄醉别壺中太乙天寥寥雲海已經年倦游復索長安米壯志寧求負郭田一歳九遷㸔布武千巖萬壑莫㽞連同時僚舊重相遇幸有蓬瀛列二僊奉寄子濟兄一紙平安附驛筒打門三印啓斜封䜛言勿辯萋兮菲舊隠猶存菊與松豈有文章傳李漢當今人物少南容扁舟逺踐龍池約共聽潺湲遶碧峯次韻子都兄見寄栖栖異縣歎飄蓬暫釋牢愁頌酒功失馬忽悲居塞上卧龍有待起隆中匪躬直道寧憂辱巧舌如簧固易窮况有知音居鼎鉉豈隨笠澤著書叢五色徒誇補衮工百年痴作蠧書蟲塵纓黧貌慙衰相窽木號風逼歳窮酌酒漫為蛇畵足覆蕉今悟鹿成空江村且索梅花笑獨有幽人影伴紅冬至前隠居慵出入嫌癖樂靜安閒秖自憐忩眼白駒催短晷案頭黄巻遣長年南枝春信應先透北陸寒凝勢更堅地下一陽何日復千林枯木已欣然至後二日至東禪至後陽和已發生野梅官柳動詩情偶為尋壑經邱計故作穿雲渡水行近郭好山皆可隠隔林踈磬有餘清他時粗免㣲官縛歸去深謀谷口耕醫僧慧昌小軒小池緑淨數游魚髙桞蟬嘶暑氣虚露臉清真雙菡萏風標閒雅一舂鋤囊中時曬君臣藥肘後新抄和扁書只此便為安穏處何湏林下與山居余寓王園適當春殘尚有小桃臨水追想昔時繁麗無復存者借仲信桃花韻兎葵摇曳雨濛濛尚有夭桃出舊叢輕薄不禁三月浪飄零常恨五更風燕泥亂啄粘香蕊漁艇猶疑趂落紅惆悵眼前興廢事靈雲今已悟真空送客乘騾足跛口占示同行欲趂江頭送客風蹇騾難强逐驕驄漫誇歴塊過燕市自笑乘船似越儂從此上車慙著作肯令折臂老新豐釣車魚具平生樂得失真宜付塞翁子清弟冒暑見過瓢飲今希陋巷顔忽聞佳客欵柴關風生荷芰青蘋末詩寄煙波疊翠間伏櫪常懐千里志在原相望㡬人閒新篘紅友明朝熟肯放扁舟取次還劉子履見懐小橋竹籬屢入夢寐因寄寂寞荒郊野水濵竹籬茅舍舊比鄰誰知綉斧文章伯尚念漁蓑潦倒人采菊佩萸思共賞落霞孤鶩興尤新關中小試鄼侯績却掌絲綸侍帝宸九日奉懐子濟兄霜天寥落鴈行孤九日還能行樂無料想山風吹醉㡌也應溪女解携壺賞心樂事今難偶弟勸兄酬歎莫俱籬下黄花應笑我獨哦短韻㸔茱萸寄子都兄兼呈上饒使君趙有翼十驛征塗雪塞川玉溪乍到意醒然家聲盍繼舍人様臺治遥分刺史天感慨壯遊詞絢錦笑談登最地流錢邦侯儻記論交舊應有新詩寄日邉橘皇樹擅芳傳楚頌厥包錫貢紀荆揚踰淮易質從為枳書尾重題未降霜四老何須隠商嶺千奴誰為種龍陽遥憐陸績懐嘉實歸奉慈顔滿袖香次韻子都兄鮑庵芍藥春歸鶯老禁無音天為紅芳著意深姝色自應傾一國多情向惜費千金如迎如舞縁風拆不淡不深愁雨侵宜與花王為輔佐欲傳彩筆繼髙吟國香淪落在天涯常畏人知使䕶遮雅韻曽翻西掖砌佳名宜亞子亭花野僧好事勤栽植北客思鄕倍歎嗟安得花前還醉倒可憐不屬五侯家中春二十七日車駕躬請太上皇帝出郊獲觀盛事次大監叔韻禁籞芳菲歳又新兩宫行樂及良辰雙瞻黄繖天回笑並御花騘雨灑塵漢殿捧巵稱萬壽葛天張樂和千人歡聲試採康衢詠帝力熙熙物自春擬和御製郊祀詩郊禋饗帝就圜丘誠格蒼穹靈既留夜陟紫壇飈馭下天臨黄道矞雲浮槐林雙闕恩方渙禾黍三登歳有秋幸覩𢋫歌千載遇慙無銀筆賛洪猷又聖代彌文考九丘寅威郊見故遲留黄琮蒼玉神娭燕月璧星珠瑞應浮禮洽漢山呼萬歳事殊唐鑑獻千秋侍臣誰薦揚雄賦豈使甘泉播令猷六龍駐蹕温州先公軄列西掖扈從至此手澤具載一時之事三十三年嗣子洪守官於此因成感事詩從龍浴日仰光輝萬里鯨濤扈六飛晉國曽聞四蛇宇周家親覩一戎衣東廵王氣隨天仗西狩麟經在紫微江海孤臣孝忠志大恩未報重歔欷雨中過幽居寺柳眼青葱桃萼紅東皇試手放春功峰巒矗矗孤雲聳澗壑㳙㳙細水通出谷抗塵身已去登髙能賦思無窮驅車更過幽居寺暫聽猿吟杳靄中次韻施少路春日拂面和風喜及辰宫幡未賜岸烏巾氷消水濼簫韶韻雪過湖漘茞若春詩律自憐心尚在宦情難與世趨新從兹排比尋芳計况是湖山舊主人少路舊尉錢塘萬壽觀重萼梅天街倦踏軟紅塵喜見宫梅漏泄春千葉剪瓊多態度九英照日倍精神香清暗馥維摩榻韻勝全疑姑射人好是孤山臨水看廣平能與賦清新會稽偶作二首去年行遍浙東山越絶重來豈偶然秦望雲深縈客恨鏡湖月白結詩縁鷓鴣處處啼篁竹舴艋家家泛釣船行役自應多感慨故山如許好風煙西陵渡口望吳山獨策羸驂興惘然竹樹幽深皆可老江山信美秪隨縁知章得請千秋觀太白狂歌一酒船更擬遲留探禹穴梅梁風雨暗雲煙垂虹亭十年滄海慣騎􅚪秋入垂虹豁眼明雲氣蓬萊底難到洞天林屋沒多程漁歌三唱客愁破鴈字一行秋影横他日若能追魯望釣車魚具送餘生贈李守宗衮英名壓搢紳傳家濟美不無人採詩于蒍承親擢樂職中和著牧民鳯入潁川宜卜相梅開東閣趂班春九重側席求竒士尺一行頒覲紫宸朱叔賜來自都城云梅已放因思毎歳飲賞之樂曽酌孤山園裏梅至今魂夢憶花開纎腰冷逼江煙瘦素臉全疑曉雪催南國相逢心恅愺西湖遥想月徘徊惜無妙語酬佳麗頼有詩仙鳯闕來尚善喜雨用元夕韻軟紅塵土沒東華未若為農樂叵涯耕隴一犁欣已足生春六夜喜非賖頓回繭館柔桑緑漸落峒山細麥花惟覺空階聽更爽齋居無睡轉河車喜雨用知宗韻呈陳丞相旱意初憂病圃場霈然甘澤起羸尫穹蒼既格由孚信徳教從來本抑强再熟言觀競藨蓘千倉行見詠豐穣帝虚左揆思良弼霖雨重期澤萬方至日宿藍田驛感舊至日天涯感慨同曽陪鴛鷺大明宫催班别殿春雷繞駐輦蓬萊曉日紅聳聽鳴鞘馳魏闕歡傳放仗醉新豐誰知獨木荒村裏扇影爐煙入夢中奉簡潘師原澄江使君話别都門歳再除歸田猶復帶經鋤春朝結佩同迎駕夜雪寒忩並直廬東閣何堪薛宣吏長安久絶子公書故人江上新開府一笑樽前氣少舒和王侍郎中春即事溪頭飛絮白氊鋪五馬班春計不踈泛宅浮家行樂勝浪花雲葉賦詩餘競傳畫㦸凝香什莫望髙軒織翠裾碧落承明分厭直水晶宫闕更誰如清明自釋異鄉節物又清明懶復追遊年少行愁慘松楸十年淚雨昏花絮數聲鸎髙紅逺緑俱無那客恨春風兩不平强課新詩作寒食不堪重憶故園餳望孤嶼縹緲風煙島嶼孤朱樓丹閣欲凌虚浩然逸興成陳迹康樂清吟足起予鰲頂蓬萊無鴈塔龍宫蠖濩擁宸居平生李杜空遐想我欲投竿學釣魚漫成能安寂寞興何長自覺無機稱坐忘一漑成功心尚在五禽為戱學無方病來乍怯衣裳裌秋至新嘗橘柚香欲識道人真靜處南華一巻是醫王
