body:
  text: 芸庵類藁巻三宋李洪撰七言律詩簡崇德葛令十載交期晚益親絃歌尤喜政聲新倦游偶是臨卭客索價慙非少室人旅舍誰驚五漿饋官梅初見一枝春挂帆明日歸苕霅從此詩筒莫厭頻殘臘喜雪散亂明璣濺竹窗不聞簷霤響錚摐剪成閬苑瑶英六絶勝連城白璧雙獨覺瓔鬘彌寳所豈無蓑笠釣寒江饑腸雷吼呵吟筆睥睨詩壇未竪降立春前一日再雪因用韻重雪催詩夜映窗杉枯竹折恣撑摐交飛梅徑妝纔半舞對鸞䑓影自雙面壁誰參少陵室羊裘試問富春江豐穰可卜邜年瑞展拓邊城築受降除日立春雪獻日春回一日先勾芒清曉試花權要㸔臘雪連春雪獨占新年與舊年梅綻香唇纔半樹桞蘓睡眼待三眠東皇次第開桃李誰顧寒松澗雪邊春雪呈通判叔無奈春來節物催東君更遣玉花開寒輕纔濕新池草勢宻重飄靜院梅麥隴潤滋豐餅餌秫田膏澤足醪醅疲民盡説豐年瑞獨恨千山阻鴈回雪朔風動地似奔雷瑞雪飛飛徧九垓玊局盡疑從地湧銀臺空訝倚天開西經佛國千峯外北過天山萬里來誇賦兎園非我事直湏興盡棹船回六幕同雲歳又殘忽驚臘雪滿羣山誰知曳履塗中去端有披蓑江上還三白吉祥千里内六花飛舞兩楹間詩成自怪無竒語欲壓劉义思覺慳仲躬示侍郎丈筩字韻詠雪次韻溪汀渺渺躍鳬翁織浪雕雲訝許同散漫六霙疑剪水連娟萬舞趂囘風瞻山遐想崑邱勝宴坐方觀色界空繡斧謝庭聯内集刑清寧用缿為筩次韻寺丞叔都城喜雪東郊初未布陽和湖上祥霙㸃渌波重璧臺遥黄竹作孤山園近落梅多表儀共仰豐年玉賦詠宜陪𢋫載歌誰憶漁舟向西塞千山徑絶獨披蓑雪中偶成呈周明逺巽二初分北帝權忽飄瑞葉表豐年隨車逐馬難為比入隙開簾絶可憐凍鎻官梅枝嫋娜寒欺塞鴈影聯翩袁安門閉惟髙卧遥憶溪頭訪戴船次韻仲信雪中見簡夜窗初映月如霜凌曉瑶霙勢渺茫清室乍欣文解祟淺斟應愜醉為鄕幽蘭儷曲三豪集黄竹興謡八駿驤聞道子猷思泛剡兩溪絶境較優長簡章叔縝海昌一别十三秋僚舊相逢雪滿頭公負才能猶掌庾我須踈散尚監州樽前强健應湏喜身外無名勿用憂昔日長官今繡斧吹嘘應念蒯為緱題雪峯象骨峯前古道塲簡菴再到愈芬芳地平雙徑崇宫殿名壓三山有雪霜栗棘金圈提祖令奎文寳墨閟宸章海昌曽禮光明相重薦罏中知見香鹽官縣有雪峯庵今為夀聖院初冬見雪頗怪寒威一倍添天花回旋落層檐慵賡險韻偏工絮自哂㣲官獨帶鹽問訊梅梢半封萼爭㸔蝶舞不鈎簾小兒學誦封胡句羔袖烘爐任附炎塗中書懐載馳十驛倦驂騑已訝緇塵染素衣歴歴征人數行店翩翩越鳥戀南飛貪㸔樹向城頭緑不覺春從海際歸客鬢漸凋孤壯志豈縁㣲禄戀輕肥元夕書懐好在東君管物華倦游歸思渺天涯春氷夜市心空壯聽鏡探官事更賖尚怯餘寒破桃萼坐㸔細雨落簷花家僮應照田蠶頻曬漁蓑理釣車監試院秋夕無聊得日華寄詩傑屋青燈夜不眠誦君佳句喜跫然别來已覺三秋逺書到難憑一鴈傳濃淡西湖真在眼鈞樞東閣况蒐賢徒勞屢起江鄕興歸釣槎頭縮頸鯿次韻王龜齡貢院浩渺春波暖白蘋溪頭廣厦旅楹新佩衿無復歌游闕糟粕空慚老斵輪門外緼袍人立鵠榜閒淡墨筆如神使君道徳魁天下膏馥分沾盡澡身送滕彦道除太府寺簿歸吳門需次論交先友接樞廷末路為寮喜典刑桃李春風同扈蹕衡茅夜雪並寒㕔蹔從簿領陪卿月行握蘭荃應列星臨别遥思五湖樂望中林屋已青青清明遣興呈郭次張倦遊佳節負清明禁籞芳菲未遍經楊柳堆煙猶冉弱杏花著雨半飄零街頭車馬來還去客裏壺觴醉復醒賸喜祥林洗塵土吳山相對眼偏青次韻秋日遣興西風暑退喜清秋倦客漂流滄海頭用舍行藏知有命山林鐘鼎豈能謀汗青漫志三餘樂飬素寜忘一溉收鵬鷃逍遥天壌内何勞八極賦神遊秋晚閒詠六年門外送苕溪遶舍黄花獨杖藜安有鶴觴逄白墮新成螭盞得朱提流匙乍飽豐年玉病齒全踈飣座梨欲問福城南去路江山猶得助難題用前韵簡日華遲遲欲去戀雙溪獨樂簞瓢不糁藜豈稱昔賢為半刺只堪老宿話全提家貧未辦千頭橘世習猶堪兩顆梨速丐雄篇重行橐三山佳境易為題次韻元量春遊恰恰鸎簧百囀齊提壺仍勸醉芳蹊麯塵弄日腰肢弱翠黛凝顰眉嫵低泉石似尋天竺寺漁舟引入武陵溪少年簇馬觀遊女勒住金銜不放嘶次王仲信食粥太白狂歌力士鐺未如食粥魯公清從教過午饑腸轉政坐哦詩青眼横竒怪爭觀出月脇詼諧猶足助言鯖卧聽古寺華鯨吼飰顆誰憐太瘦生臘夕直宿枕上偶成北風洶洶應嘉平㸃滴簷間雨未晴病骨可堪寒栗烈老懐仍怯歳崢嶸湯婆漫許登禪榻黃妳無因伴短檠庫中火禁清絶夜闌愁不寐擁衾龜息待窗明歩過仙霞嶺迢逓南詢過百城五漿先饋不須驚侵尋老境凋雙鬢耿介孤忠有寸誠入眼越山多秀色背人閩水大無情扶笻趼步仙霞嶺自笑媻跚勃窣行次韻德孚詠梅徙倚名園鎻緑苔亭亭氷艷為誰開乍疑奔月常娥去忽見尋梅僧孺來淺笑故應窺水鏡片飛看復落深杯王孫家有雪兒唱莫待霜天曉角催初陪扈從紫禁晨曦拂曉開南山秀色鬱崔嵬立班馳道蒼龍闕逼耳嵩呼遶殿雷清蹕一聲黄繖動屯雲萬騎景輿迴端門緩轡哦詩罷誤入鈎陳豹尾來次韻馬駒父大閲譚笑詩成馬槊横偏師何敢犯長城縱觀儒帥臨戎幕想像天山破敵營麾幟精明嚴武備山川彈壓颺威聲老來壯志渾消盡射虎南山媿北平和子都兄修佩魚恩假銀魚閲四年新元𤓰戍尚悠然滯袍自昔多屯蹇英衮當時誤軫憐司馬青衫佐湓浦參謀朱紱向西川玊堂伴直如相念安敢沉酣不上船陳伯和和經字韻復以為報説詩夜對老彌明韋氏傳家自一經盛德於今推鼎甲聞孫何事亦飄零囊貧桂玉人逾瘦袖有珠璣耳暫醒桃李春殘歸未得愁㸔煙草五門青南臺㸃集海艦粤國無諸故壘摧吐吞江海亦雄哉峯巒疊疊青螺髻翠幄重重錦繡堆破浪乘風浮戰艦荒烟落日傍龍䑓倦遊已喜𤓰期近立馬沙邊更㡬回陪史志道侍郎徧覽南園北第之勝即席賦詩我公胷次妙陶甄幻出壺中小有天地近滄浪占風月目吞笠澤飽雲煙玉盃金盌開新第燠館凉䑓繼昔賢聞説傅巖通帝夣遄歸黄閣卧貂蟬共樂臺鱗差萬瓦拱層䑓暇日登臨亦樂哉桃李成蹊春未到江山如畫國多才倦遊難效登樓賦勝槩常遭俗駕囬好是清宵携客醉雲間兩兩近三台和人松江來往吳松二十春五湖煙月舊知津髙秋楓落哦佳句斜日江邊膾細鱗誰解扁舟載西子獨憐茶竈老詩人自慙遮日長安道深愧漁蓑浪漫身八月十八夜月有懐伯封秋半青要未降霜溪邊獨對露華凉風清月白興不淺斗轉參横夜未央毎望庾塵頻障扇莫逢伊笛據胡床揚暉千里誰同賞心折刀頭快理航秋夜艤舟駱駞橋對月新秋清夜月當空弭楫駞橋意象雄銷恨難求賢士酒揚塵厭共庶人風市聲暫息更籌永漁唱頻驚客夢中紺碧瑠璃千頃凈頑仙常占水晶宫哭藥寮先生先友凋零風義衰繡衣躧履荷深知未乾薦墨俄聞謫欲寄郵書忽報危賦就徒能感知己樽前猶憶細論詩白珪一玷身難贖痛哭須陳弔屈辭哭㓜子二首兼旬哭子鬢成絲老眼眵昏淚綆縻玉雪可憐凋並砌金環無復探鄰枝何堪投杖逢曽子誰解推天繼退之滄海逝波無返日覺城南去有逢時苖而不秀實天年亭近千秋瘞祖阡季札於嬴稱逹禮樂天學佛尚成篇情鍾我軰誠難遣古有東門豈信然恩重詎堪耘愛草擬將苦諦問南泉次韻子都兄寄伯封論書絶藝當如郢匠斤家雞野鶩漫分羣山陰妙法羲傳獻江左名聲薄繼欣競作墨豬無健骨誰知筆髓貴豐筋斯言舉似秦谿後三折君須子細分移竹詩伯封垂和且聞兄弟皆欲作因用元韻奉寄海甸尋盟肯遽寒叵嗔乆未竪檣竿張儀尚有口中舌貢禹未彈頭上冠處處句竒有神䕶行行墨妙似龍盤阿連知有驚人語鶴膝因君舉似㸔宻宻脩篁入檻寒君來移取出簷竿結根久近幽人屋觧籜宜為壯士冠曽共馬蘭同請客不憂苜蓿但堆盤從今莫羡蕭郎畫風月良宵仔細㸔秋雨歎西風獵獵暮秋天昏霧滛霖海氣連雨脚如麻雲潑墨禾頭生耳稻漂田庭前槐樹惟増歎堦下决明空可憐愁絶寒儒思廣厦床床漏屋夜無眠尚善再用韻訪梅不憚詩催白髪生年年梅綻酷留情寒枝幻出横斜影舊曲猶堪一再行越嶠雲霾春最早西湖煙水夢尤清他年相望千山阻公在鑾坡我退耕泊石壁值雨江頭驟雨壯灘聲洶湧琮琤亂石鳴咫尺煙林展圖畵二三村落隔陰晴方貪暍暑逡巡退坐覺風霜指顧生試倚篷窗臨石壁哦詩心迹得雙清探梅次韻章庭倚江園試覔去年梅花下遨遊得暫陪脉脉早迎南日至垂垂先放北枝開江邊墻角添詩興月落參横喚夢迴一見清香心已醉何須更待麴生来欲探梅西山簡元量尋梅試欲向江津冷蘃商量效小顰洗雨梳風無那瘦巡簷索笑為誰春西湖苦憶㣲吟老庾嶺偏愁折寄人知有清詩似何遜可能嚼蠟對横陳得家書傷春渺渺獨凝眸黄耳歸時暫放愁跪得雙魚開尺素别來一日抵三秋花前塊處憐秦贅澤畔行吟類楚囚預約鯉庭歸省處清微風送木蘭舟游石門洞溪壑縈紆礙去舟石門雄峭未曽游雲深飛瀑自成雨洞闢雙扉最上頭紫府丹䑓疑有路碧巖紅樹飽經秋追懐顔謝當年興坐聴猿吟和四愁題外舅墳庵昔年把酒共㸔山猶冀相從物外閒零落山邱遽如許膏肓泉石許誰攀形神孰與論三住夢幻全真悟八還拱栢喬松助蕭瑟獨乘明月弄潺湲嵗除客裏光陰又一年人情真復似憐蚿家貧尚有春名酒才拙安能雪命篇弱柳經霜半凋落修篁沐雨更便姢親交歳晚無書劄常閉柴扉穏晝眠十六夜待月海上月到中秋已壯觀更㸔飛出海邉灘光連貝闕鯨鯢駭冷射蓬壺屭贔寒萬頃銀濤俱皎潔一輪金魄尚團欒當年太白曽觀此寧肯呼為白玉盤題李提刑事實名芘字積仁百雉安危欬唾中三平狂㓂不言功魯連解難髙千古回紇投戈見此公欲上史官傳逸事要觀著令獨稱忠儻能配食郷人社宗衮宣城偉績同宣城郡人以故太守李光捍㓂全城列欵于朝立廟春晴佳晴逰侣賞穠華免使綸巾雨墊紗苒苒芳塘徧春草溶溶流水蘸桃花閒官尚許親黄巻學道安能佩紫霞多病無心與春競窗前靜聽晚蜂衙次韻子濟兄送行春草年年愁望勻鴒原鼎足嘆離分惡詩恨别江南社駑馬慙辭冀北羣細雨催行將食冷片㠶歸省待風薫贈言况得珠璣句筆陳翩翩妙五雲壽老餉笋陋巷晨炊樂一簞慕羶逐臭兩知難自甘香積伊蒲饌寧歎欄干苜蓿盤禪老竹萌資凈供詩人菜把誚園官喜參玉版宗風在何待叢林一擊㸔隠巖吳體屋頭日日闖雲山簿領沉迷肯放閒一行作吏遽如許三徑就荒那得還緑陰留與後人憩叢桂時招好客攀邂逅清泉與白石岸巾時得洗衰顔題雲間尉㕔吏隠東南一尉笑卑栖小試崑邱並海涯千里僧包游㕍蕩九霄鵬翼躍天池南昌隠吏真相稱西蜀參謀更好詩官舍從來同傳舍清規留與後人師飛霞洞謝公巖呈元量謝公遺躅閟蒼苔乘興飛霞得得來洞鎻暮雲松偃蹇江涵白月影徘徊吾曹趣了癡兒計蘿徑難留俗駕回安得麻姑能送酒他時藉草共傳杯元日元日歡情客裏稀追陪人事强開眉不知爆竹催年去但恠屠蘇到我遲梅蘂欲撩東閣興宦情終愧北山移未甘直道猶蕭索詹尹何辭為拂龜題羅源尉廨壁坐來山氣結層隂解橐迎凉濯暑襟頼有新詩成獨諷惜無嘉客伴孤斟緑荷翻雨傾珠碎翠竹摇風引鳯吟習射更思矍相圃麗龜試㸔僕姑金别吳興從游五亭四水盛㳺從閒客閒行興每同暫捨𤣥真漁隠計却尋康樂舊詩中振衣濯足滄浪水快意迎人舶風儻有任公投巨犗割鮮共飽淛河東次韻仲信留别倦游再閏入都門喜見隆興詔令新功業詎堪銘日觀龍鍾空歎倚天津題詩竹閣逢寒食修禊蘭亭及暮春我欲扁舟成泛宅五湖煙月伴漁人錢塘遇沈時仲匆匆索别三年啄腐共吞腥乍解南冠覲舜廷新貴論交頭漫白吾曹相遇眼終青休嗔輕薄紛紛雨還恨分擕落落星歳晚江湖未歸客蒯緱彈鋏不堪聽九日與客登鳯凰山酌湧金泉泛舟西歸西山爽氣壓城閭携客登髙日未晡稚子已諳撑舴艋老夫羞更揷茱萸文章不進空黄妳生計無多問木奴貧病偏愁秋欲雨異鄕白盡遂良鬚九日詠懐簡仁實登臨勝踐負幽期山色溪光日益竒那得賜茱來北闕漫從採菊向東籬升虚楚望猶能賦振履商謳祇自悲可是閒居愛重九尉仙落筆有新詩淮上亂後寄子都兄五詩黄耳東來喜可知鴒原書札慰愁思艱難莫話平時事愁絶長吟别後詩再到空存舊城郭遺黎重覩漢官儀故鄕枌梓凋零甚夢寐蕪城秪益悲憶昨王師北渡江山東豪傑已爭降銜枚夜雪俄平蔡斫樹明書果死龎志士裹尸須馬革舊官祭竈熟羊腔老姦牖下終何幸逺愧睢陽廟食雙兩淮黔首苦飄零廟算成功再底寧頭斫新都攄宿憤臍燃郿塢赫王靈羌人半已投戈拜父老從觀扶杖聽欲勒燕然繼隆碣大書誰紀史編青殘臈倉皇間道奔相逢悲喜語還吞巡簷惨淡梅花月壽酒淋漓柏葉樽禦敵孤城存即墨還家聚首似羌村見㡬在莒思深戒只恐黄金注自昏多病新年白髪生愧無籌策賛親征彎弧空作餓䲭呌逐鬼休嗟走狗烹鳯閣鸞䑓少知已天台鴈蕩恣經行可憐未遂求田計空負江湖浪漫名扈蹕玉津園麗日祥雲覆苑墻柳絲馳道麴塵黄山呼萬歳迎春仗花覆千官獻玉觴騄駬籋雲天歩逺騶虞節射樂聲長御射中的必奏樂云微臣奉引陪鵷鷺許聽簫韶入建章泛舟之龍塢苕花如雪忽秋殘翠老溪頭㡬曲山心逐浮雲朝獨出家臨清霅暮能還世情大似醉翁醉景物偏偷閒客閒早晚誅茒繼三徑招呼明月㺯潺湲寒食日從駕聚景園宫殿千門敞禁闈西湖綵仗小遲徊競瞻黄屋寧親樂更喜重離捧壽杯萬騎戎装花㡳散一聲清蹕日邉來天街向晚珠簾巻十里春風待駕回游華盖山容成洞天小雨亷纎早醸寒清晨來訪道家山寂寥玉座纓香覆㸃綴碧巖楓葉丹地勝七山星有斗人疑千歳鶴飛還閒繙洞簡尋真訣脉望難求髪似環餞史開府奉祠歸四明千載風雲佐命期黒頭先冠鳯凰池赤明龍漢昇平運河目龜文柱石姿譚笑功成調鼎鼐爕和元化靖華夷拂衣袖手林泉樂咸仰中興帝者師衮繡貂蟬侍太清致身將相極儒生三槐正位巖瞻峻兩鎮交兵節制榮晝錦蚤傳留鑑水召棠重喜蔽龍城願將閭里新謡詠長和㴞㴞西峽聲千里全閩按八州曽聞三相衮衣遊誰知今代甘盤學寛盡吾皇南顧憂家給乞漿皆得酒年豐賣劒有耕牛詩歌緑竹為公壽父子應須並相周主眷方隆便乞身共欽勇退解樞鈞湖山勝槩神仙宅文武崇勲社稷臣未許赤松陪杖屨却須黄閣再經綸蒼生指日為霖雨仄耳宣麻寵數新和玉泉逹老餉筍籜龍孤介亦駢闐不比花蔫與桞眠雪裏頓超千佛地風來應上四禪天飽參玉版頭頭是秀出薌林箇箇圓知我逺庖薇蕨少倒籠登爼共便娟和尚善西禪寺冲虚宫詩學道尤湏惜寸陰漫勞飰袋走叢林溈山自昔提宗印閩嶠于今絶賞音得髓得皮無著相非心非佛見機深豐干未免成饒舌月在碧潭空指心飇馭臨風杳靄間支笻欵步訪星壇羽人莫問昇真事古像空瞻玉佩寒井洌不逢龜曳尾鼎存猶想汞新乾徘徊遐想來仙驥皂莢成陰荔子丹雨中慈感寺泛舟渺渺汀舟雨滿川樓臺煙靄羃愁邉春風邀勒梅都謝夜雨淋浪桞尚妍僧鉢偶分蒲塞供佛香時送水沉煙佳時更擬携笻出拾翠人歸喚渡船謁曹娥祠貞魂純孝瘞江湄滿目江山故國祠海賈時來楫迎汝山君欲下桂為旗九歌合繼湘妃些千古塵昏㓜婦碑月午潮平波似練蕭蕭風竹隴猿悲追和下若大雄寺汪内相陳朝檜詩斮骨刳心操凛然盤根厚地老逾堅八千椿木應同壽十五堯蓂莫紀年辱井已荒傷故國瓊枝無復盗春權六朝陳迹空餘此閲世真成歎逝川送許季韶倅桂林尺五天邉㸔頡頏參辰出處九星霜未令掌誥吟紅藥屢喜嘉言貢皂囊懐紱寓居欣㑹弁監州歳晚客殊方桂林頼有詩書帥好共驂鸞上玉堂
