body:
  text: 藝庵類稿卷六宋李洪撰啓除左帑謝廟堂啓丞相府之掃門敢希孟晉中都官之庀職忽冒超除埏埴恩深叨踰顔厚竊以為官擇人者朝廷之治惟器是適者宰相之方英雋無怨于下僚驥騄並驤于夷路矧聖主握圖而總攬宗工獨化于陶鈞外之則萬國承流內之則百司庶府用人不間于親故韙祐甫之陳謨得賢能立于邦家致成周之極治掄材無滯籲俊在朝若時左帑貨布之權實専有司出納之吝法嚴令具靡資心計之能為疾用舒務廣錢流之效雖曰具員之冗實階要路之津斥瓊林大盈之儲既革奉天之橫賦繼建隆內藏之積將贖燕薊之遺民粵若司存宜知國體如某幼顓學古壯偶績文疲精刻楮之勞無用屠龍之藝陸機入洛志襲先人之清芬揚雄草𤣥晚悔童子之少作徒勞俗狀蹭蹬窮波沉舟坐閲于千帆涸轍方須于斗水尚軫門牆之舊物俯憐羈靮之故家誦介推之卒章敢意封于綿上效叔敖之抵掌乃獨薦于王前湔袚陳人躐陪多士孤忠未泯慨精爽于衛公報德何時效老人于輔氏亶謂曲成之造悉歸大播之公某官道運寰中功侔繫表集大成于宣聖全浩氣于孟軻咸一德以享天心克懋阿衡之美兼三王而施四事用彰姬旦之勤致此瑣材亦叨器使某敢不益修家訓期稱已知飾儒雅非俗吏之能商功利豈小人之事姑安顔巷終入修門十年管庫之奉公斯㑹計當而已奕世詩禮之素習豈玉帛云乎哉誓竭至愚仰酬大賜左帑到任謝宰執啓結綬王畿玷中都之帑藏及瓜葵戍荷元輔之陶鎔揆日效官披雲旅見兹極平生之榮遇悉繄大播之曲成輒贄骩詞仰干崇聽竊以王者總四海之富賨􅞲琛幣充牣于攸司大臣宅百揆之尊椳臬扂楔作成于器使宜搜心計俾掌利權仰乾緯之躔上符天庫擬白藏之富控引世資攝承其間出納惟吝如某者幼承先訓壯頽家聲既乏萬選之聲徒紆半通之綬家慚金穴論著錢神蹭蹬星霜艱危道路富寧潤屋每嗟彭澤三徑之荒業貴多文有類臨卭四壁之立甲辰自誚庚癸長號彈蒯緱而食無魚夢覆蕉而焉得鹿歎安仁之數免羞梁竦之徒勞祿不洎親固己再仕而心再化學非為己方將三沐而坐三薰俾校貫朽之緡曷致錢流之效幸依宏覆庶逭曠瘝某官一代耆英四朝長德佩安危之寄維石巖巖諧該輔之聫台符兩兩社稷泰安于九鼎聲名震憺于四夷位隆而身愈恭靡忘吐握功髙而口不伐即正鈞衡顧此礦頑亶逢幸㑹免呼涸鮒之轍獲掃行馬之門粒粟一枝方遂鷦鷯之適雙鳬乘鴈得依渤澥之遊賀直院舍人啓晨趨中帳暮直北扉紬金匱石室之書望隆太史連翰林華蓋之直眷厚詞臣文字之祥衣冠鮮儷某官學探道祕識照幾先四十嵗而不動心時推孟子五百年而必名世親見揚雄遍儀清切之司接武功名之㑹問中朝之李揆安肯來耶對宣室之賈生今不及也上心乃眷要職仍兼播黃麻之六經契楞伽之三昧相門有相而將門有將豈惟世濟于八元伯氏吹塤而仲氏吹箎實掌王言于兩禁冰銜彌峻禁管增光絶麟筆于汗青拜衮衣而頭黑一命再命三命罄傴僂而走循牆大書特書屢書誅姦諛而發潜德某曵裾惟舊䝉盼最深出入玉昆金友之間頗念東里西華之困儻憐臭味久歎陸沉誦佳句于百僚雖愧杜陵之作求竒士而再薦庶辱梁公之知賀虞知院啓趣朝丹陛入冠鴻樞借箸運籌委任實資于元弼定功保大仰成方賴于宗工聲憺華戎慶關廟社竊以主上躬大有為之志而羣臣莫望于清光我公負古王佐之才而舉世咸推于舊德乃眷樞機之重尤嚴宥密之聫體貌亞于台衡班列髙于參預敷求人望故虛府者歷年渴見儀刑不崇朝而正位矧偃兵而修睦寧弛備于邊防聚精㑹神亶須逺馭折衝厭難遂底迓衡果聞命世之英增重本兵之寄某官名髙九牧忠貫兩儀垂光虹霓之輝稟氣岷峨之秀夙藴尊主庇民之略出符興衰撥亂之期督師旅于戎昭旌麾動色殱凶渠于江介草木知名豈惟談笑而却秦軍固已威重而讋漢相勳髙微管澤懋翼商爰從緑野之遊殊鬱蒼生之望昔詠周公之未復今欣季子之來歸佇觀樽爼之謀式契腹心之助稽建隆之故實何嫌並相于三公繼元祐之師臣將復平章于重事某迹縻管庫恩倚門牆頃由銓部之調官辱記石渠之先契顧兹困躓再託陶鎔躄足病駒儻令于起廢沉舟枯枿有待于逢時賀同知參政啓丕膺綸制進執事樞右府偃兵方倚折衝之略中臺本政實陪論道之司人望所歸國威自振竊以國家肇隆宥密俾専帷幄之籌唐賢或拜參知蓋均鼎軸之任仰惟宵旰厲精之治尤嚴夙夜基命之廷非嘉言久契于宸心則德望素孚于士譽儀圖共政僉屬我公某官智為帝謨道扶皇極南金東箭粲然王國之珍北斗泰山仰止文章之瑞罄盡規于諌諍愛莫助于將明惓惓利社稷之言娓娓憂天下之論萊公忠義力贊澶淵之征韓愈剛方克佐淮蔡之烈却楚人之問鼎知魯國之用儒事久益明上方圖舊聽直聲于履暫居八座銓綜之崇覆相名于甌徑躋三事弼諧之寄竚膺爰立永佐中興某託契最深掃門特後嘗辱溫言之賜儻回寒谷之春崇舊好于竹林預新陰于桃李大均播物庶幾坱圠之中東閣方開輒綴英賢之賀通楊漕啓由義解雋不疑之劍蚤獲登于門牆題陳仲舉之輿遂得依于屬部方問塗于千里竊有賴于二天輒贄箋函仰投燕几某官英猷命世徑節邁倫松柏後凋猶負棟梁之用蓍龜先見灼知治忽之原方和戰之議雜進而盈廷雖輔弼之謀環視而拱手單車馳不測之地片言結再合之盟至諴感于神明忠信行于蠻貊朝紳聳歎聿為三表五餌之勳國勢尊安復增九鼎大吕之重眷倚益隆于丹扆蕃宣洊錫于朱轓升南宫郎省之髙華陪右府幾庭之密議若時閩粵遴選皇華將輸姑寄于外庸獻替方虛于法從寓直西清之邃用寬南顧之憂挽粟飛芻既豐于大計簮筆持橐行陟于禁塗某跋躓無堪嶔崎可笑少雖有志思企及于前修壯且無聞愈摧頽而漫仕頃司金于外帑俾佐治于南州顧其流落之艱窮令𨽻澄清之刺舉倘寬程督請事教條居官無以踰人奉法亦足為理清河持孺文之舊非敢擬于昔人晏子知石父之賢庶獲伸于知己通傳漕啓自得慕暴公子之義願瞻衣繡之光慚陳仲舉之才不稱題輿之任方問塗于千里獨竊庇于二天輒致箋函仰投棐几某官英猷命世雅量鎮浮節義大間承獻簡勳勞之後文章正法襲雲龕衣鉢之傳學者仰之北斗泰山詞人擬之良金美玉適際厲精之旦爰膺共理之求效信納忠式契對休于九陛承流宣化豈勞奏最于三年主父興見晚之嗟賈生有不及之嘆冠太微積星之省擅晉陽一門之榮伯氏塤而仲氏箎有光鵷序質為酥而贊為酪著美鴈行若時甌閩飛挽之權實寄宸扆耳目之重蓬山寓直宜領袖于諸儒南國觀風載澄清于屬部訖外庸而作輔徯中詔之遄歸言如絲言如綸嗣見告廷之典册用汝礪用汝楫竚觀繼世於鼎司某跋躓固窮嶔崎可笑頃備員于外帑俾佐治于遐陬矧兹逺官之漂流實賴皇華之刺舉陪建炎之羈靮倘懷先友之同朝挫跋扈之姦雄尚誦南宫之鯁論少寬程督請事教條雖居官無以逾人然奉法亦足為理埋輪冀部顧安問于狐狸涉筆藍田庶少清于鳬鶩通王漕啓佐趣朝丹扆寵畀漕臺以侍從之重而主計司固優刺舉以版曹之舊而總調度奚俟斡旋惟兹八郡之提封具識九重之注倚凡依庇賴罙切歸投某官學統聖真道扶皇極文章冠于天下智略湊于上前奉對宸廷非子大夫尋常之語司言左省結聖天子特達之知幾三入于承明類九年于楚澤招不來而麾不去咸欽直道之有光尊所聞而行所知共仰真儒之無敵矧自狀元而拜宰相本朝今數于六公而由孔子至于孟軻名世蓋踰于百嵗尚屈調元之大用來紆攬轡之循行即慶衮衣諒無暖席某蹣跚不進跋躓固窮頃緣羈靮之故家猥玷廟堂之除吏叨司外帑黜二遐陬方疲簿書期㑹之煩遂有夏屋帡幪之託重憐季父蚤締素交豈期竊幸于二天或者粗勝于一割序橛株集序詩于文章為一體必欲律嚴而意逺模寫物狀吟詠情性象外之象境外之境昔人謂如藍田日暖良玉生煙可望而不可置于眉睫之前其難如是前輩用心之専終身不以為易繇建安至六朝莫盛于唐三百年間作者衆多傳于今尚百家而言詩者必以李杜為宗豈非専于所長乃能名家耶皇朝之初時尚崑體自歐陽公王文公起而一變怪澀為清圎蘇黃繼鳴四方風化句法乃復于古而釋子工詩代不乏人豫章流𣲖學者競宗祖可善權蔚為領袖其後異才輩出矣武原僧源浩字濟逺人多稱其學問尤長于詩老且病悉焚其稿死後四年得可舒上人手録詩文一編觀其用心之専資取之博雖前輩詩僧不能逺過然後嘆其才不偶命向使列於儒服必能犖犖取竒節而心勤翰墨無名譽于當世詩之所存者如此而已舒請序其首以慰斯人于冥漠中昔劉夢得評靈徹詩經來白馬寺僧到赤烏年謂入作者閫域豫觀浩之春雪則有舞空初認蝶著樹忽成花又云吟合暮雲餘語碧講終流水靜音潮語皆清婉不愧古人凡録古律詩若干首雜文附焉合為五卷題曰橛株集紹興丙寅嵗序靈椿庵芝草序按仙書五色芝神仙所餌必生于山間石上曄然有光或蔭以卿雲守以麋鹿然世不常見服餌之方不得其傳間一出于時乃與嘉禾瑞麥為太平之象彼生于禁掖銅池齊房帝所則宫童效異樂府作歌圖繪其形金玉殊色足以蕩人耳目真治世之偉觀也不幸而生于深山窮谷人跡罕至委之草莽槁枯腐敗于巗阿水涯非有隱遁之士山僧逸人見而採掇則舉世無知者又有感純孝而生墓上表循吏而出園囿此亦遼濶而創見也國朝祥符中登封告成得靈芝三萬餘本宣示于朝覽卷慨然生逢中興海內乂安治俗泰寧萬物嘉生和氣之所薰灼宜殊尤之祥無愧疇曩雜遝委至薦于郊廟而上方黜休祥之奏儲神邃古郡國嵗以瑞物上太史合于圖諜不可殫紀皆祕在蘭臺莫得而聞若此之時芝生于窮逺之鄉不為士君子所表見又不知其幾也雖然必有積善之家將委曲默告其聯不克獻諸朝廷之上而示私家之祥者詎可略乎觀天人相與之際非可與單見淺聞者道也嵗在甲戌紫芝生于太平山外舅燕居之所光彩絢目非醇和之氣所鍾寧有是耶竊聞商山四皓秦漢間隱居茹芝夀數百嵗為地仙陶隱居注本草亦曰芝者仙藥可以延年度世而不老則兹瑞之應其錫以難老之符歟戩榖之來既夀且臧方興而未艾私竊志之將以慰兹芝之不遇而幸豫之親遭因繪為圖並序之以貽好事者送趙德逺序湖湘之南列郡惟八衡陽去南嶽最近其屬吾巴在承平時上戶十有八萬其風土人物之美嵗貢金犀之珍韓退之謂衡之南地益髙山益峻水清而益駛中州清淑之氣于是焉窮蓋繇關中視之也中原多事以來衣冠落南者既衆往往稱其清絶載于賦詠况近時遴㨂良牧分符之寄皆名人上龍飛之五稔推于屬籍吾友德逺得守衡陽德逺天枝之秀為人和而莊議論卓越早以文章决科好古樂善無王孫貴遊之習有書數百卷鉛槧甚精作詩數百篇風雅畢備極詩人之體紹興戊寅余譏征畿邑德逺為丞最相厚善别八年余官左帑而德逺被命入對便殿稱旨自别駕真拜二千石頃在畿邑德逺攝邑事民訟皆立决庭無留人退必哦詩命觴博約古今無虛日秩滿佐七閩帥幕練習吏事有聲大府下俾臨一州固易治然黨友間尚咨嗟惜未大用余謂方今聖天子循名責實嶽牧尤不輕畀凡分符及瓜必趣入對天語下諏必究民瘼欲膏澤亟下于民雖漢宣厲精文皇求治不過如是德逺之守郡將核課最以升公卿為不晚矣德逺髙明之學濟之以忠厚當不鄙夷其民如栁州政拙催科如道州異時湖湘之間刺舉六條薦賢二千石必衡州也謹為之序記鹽官縣南福嚴禪院記杭之屬邑曰鹽官民淳號易治風俗簡檏尊儒而崇釋邑東南瀕海斥鹵漁鹽之鄉皆逐末業牢盆之利嵗成視西三鄉為豐歉農夫深耕利于早熟蠶婦織絍以勤女紅樂嵗家給人足斥其贏奉佛惟謹故民居與僧坊櫛比鐘唄之聲相聞隆樓傑閣錯立鼎峙飽食豐衣緇褐塞路不耕蠶而仰給于民者不知其幾千指也尼居有三曰福嚴禪院直邑南隅紹興乙亥嵗冬豫譏征是邑暇日過其門敗屋數楹像古器刓門堵頽闕蓬艾蕭然如蹈無人之境今十稔矣而住持淨歡以修院記屬豫竊甚異之乃夷考其因革之繇先是院圮壞不治紹興甲寅嵗其徒希照募衆重修佛殿塑飾瑞相始作鐘樓隆興改元惠勤載捐衣鉢重新之乃立三門兩廡甓甃階級周以垣墻今齒逾八袠薰修不倦净歡繼踵院席嵗將終星祖孫三葉協力蕆事凡鐘磬鐃鼓爐香龕燈華幡道具皆革故而鼎新之邑人父老咸加信嚮其事可書按是院立于南齊髙帝建元四年尼曰僧猛捨宅為寺號曰齊明猛姓岑氏南陽人徙鹽官五世矣曽祖率晉餘杭令事載髙尼傳而元和姓纂云岑本南陽漢舞陽侯彭之後軻為吳鄱陽太守徙鹽官亦與此合至五代漢乾祐中改護國報恩院今曰福嚴者本朝大中祥符元年敕所賜也薦罹兵革前志不存姑載其大略噫是邑僻在海隅象教之盛僧有禪門尼有猛師今其學者代不乏人方朝廷既闢度異時必有若總持發眀心要接物利人於此伽藍闡揚宗㫖豈但營造土木之功可紀哉豫知歡之志實在於此故併書之以勵來者乾道三年嵗在丙戌十月十日記隆恩庵記吳興郡南羣山輻輳截然當苕溪之衝者衡山也苕水出天目而來循山始東又北匯霅水貫于城中入于具區衡山春秋時嘗為楚越之交圖志可考山之陽有隆恩庵者姑胥鄭繼先所作也繼先既葬其先大夫于兹山有年矣又築屋于墓道命瞿曇氏修香火之奉問名于豫曰願有述焉豫告之曰君子之思報其親寧有既乎春雨秋霜則有怵惕之感松聲滿谷而增風木之悲惟先大夫以諸生起家力取科第分教朱邸二郡苕溪駸駸向用矣年踰耳順致其事而歸頃倅是邦時繼先方垂髫執經膝下豫每過先大夫必笑談終日逮豫丁外艱蓬首墨衰卜竁山谷往來尤稔先大夫遇我厚調護襄事無毫髮不盡于死生之際髙義凛然先大夫既謝事距今六閏宰木拱矣豫來都城繼先頻嵗相過頎然開爽能自奮厲與諸生角藝銓闈與之語纚纚可聼益嘆先大夫之有子也昔吾夫子既合葬于防曰古者墓而不墳蓋始立封崇之制矧今墳庵之設自公侯達于庶人咸遵西方之教實資梵福雖未必合于禮經然聖人復生亦不可廢也于是稽戴記三年問之義于父母加隆其恩之說榜曰隆恩且以告繼先當率禮經以克承先訓後嗣之賢者能致其敬竭力從事以報其親不敢盡廢不亦可乎繼先名紹孫豫之表弟云乾道四年五月晦記傳石碣傳石碣字文炳其先居岐山周宣王太史籕從王搜于岐陽得鼛昆弟十人薦見稽蒼頡鳥跡之制誦及逸詩其詞古雅遂封于岐周末無知者隱居草澤裔孫篆始皇時為丞相李斯舍人二十六年初并天下命篆以昆吾刻和氏璧為受命璽拜尚璽郎將講封禪東行郡縣上鄒嶧山既封泰山禪梁父諸儒稱頌功德斯獨奏篆文最工刻石泰山第功封倫侯後從上㑹稽探禹穴遂不知所終劉項戰爭髙皇帝馬上得天下獨萬石君以戚里顯後漢中郎蔡雍以經籍去聖人逺文字多謬俗儒穿鑿疑誤後學乃奏求正訂六經置大學始薦篆礽孫佐藝文志佐書八分𨽻字也通經繇民徴博士于是儒生晚學咸取正焉石氏遂振因郭有道稱曰石君金石交死且不朽人亦謂無愧辭有子銘喜論功閥從車騎竇憲征單于班固為銘最善以軍功封燕然侯弟碑魏大臣鍾繇立請禪受禪于譙郡文皆倚碑刋削其後子孫散之四方仕吳蜀皆有能稱典午南渡曰楷仕中書監與㑹稽內史王羲之父子遊羲之嘗至許觀元常故迹欽重其為人永和九年暮春修禊山陰蘭亭文志為世模範隋平陳自楷六世有碣夙稟異質螭顙龜趾與永興公虞世南素善始仕隋蘭臺丞文皇初開天䇿文學館號登瀛洲碣特方重面目嚴冷黑白分明帝所敬雅不為兒女子嬪御所喜久不遷時諫議大夫魏徴剴切針帝闕嘗從幸九成宫醴泉徴泚筆目碣驟諫以仁夀故宫為言碣辭色古朴望之凜然人皆畏避帝嘗稱徴嫵媚而獨尊憚碣方正巖稜也㑹徴薨帝臨朝嘆曰朕寶三鑑徴逝一鑑亡矣顧碣巍然有雅望宜居史職時修文德皇后園陵碣遂奏疏諫厚葬非古援漢文灞陵規帝雖錮南山猶有隙穴尤嘉納遂以本官修國史命護葬昭陵親勒文以貽後嗣帝思徴忠亟命將作大匠乘驛趣召碣對便殿碣外負文章每以副墨自將遇給札上方用㦦㥴無邊幅筆削雖逡巡立成或脂蠟其貌所謂文不加㸃帝尤惓惓屬目即日命以御札表徴墓拜同中書門下三品南朝有三品石封樂石侯年老得寒疾語訛昏耄嘗嘆曰易所謂大耋之嗟表乞骸骨加尚書令致仕封即墨公後以徴子叔玉停昏碣亦不能無觖望譛者毁短之詔下廷尉因被疾風眩仆地舁至沙苑薨子志負學行重質魁然長者悼父方正譴卒不肯求仕天后時李北海雍號詞林偉人與遊嘗譜其系至八百素厚張燕公說晚為姚元崇賄玩所賣終身恨之顔魯公真卿元道州結文翰表世嘗共遊浯溪頌中興咤曰名字託石生信磨不磷涅不淄矣其見重如此至于王公家廟德政佛老祠宇所至每加礱礪折𠂻厥後昌黎韓愈主盟古學少許可亦稱仰如泰山晚節詆訶浮屠乃諛墓中人取白金佐淮西軍見仆于石烈士石氏重厚衰矣在嶧山有棗氏子肥謂石氏自出尚有典刑嘗見詩人杜子美或謂遭野火焚死今無聞焉贊曰石氏苖裔尚矣衛大夫碏列於春秋秦漢以來嗣續多賢文采不泯廬陵歐陽子㑹稡金石刻辭至千卷鳴呼盛哉至碣之嗣亦可謂卓犖巨人矣惟白居易賦北邙寓諷而皮日休亦悲野廟蓋警夫竊辨纓而尸祿位抑所以責備賢者後之君子盍思自勉于不朽歟銘紫微龍尾硯銘并叙余生嵗在己酉大駕南巡先公扈從掌誥紫微閣下渡江故物散逸得龍尾圜硯焉于時天子焦勞庶政躬攬豪傑思濟多艱以圗中興復古之功初詔誥命令布于四方武夫悍卒讀之流涕按劍而志存伊吾之北矣將相同心共奬王室聖主推赤心置人腹中故建炎德澤深結民心惟我先公以一身執羈靮從上于艱險中能導上意鏗鍧震蕩濃墨大字摹寫天地發揮日月俾民咸曰大哉王言方其搦寸管于屬車警蹕之間使如雷如霆號令迅速與夫吮墨盾鼻而草檄橫槊馬鞍而賦詩固不侔矣斯硯有助焉皇天悔禍成今日中興之業亘越古昔丕丕之基對天無競繄前日作士氣得民心之故也彼有曝茒簷之冬日話玉堂于田舍况兹硯為李氏之寶豈與文房之玩可同年而語哉謹勒為銘以示子孫使毋忘先德益勵報君之忠也月團團兮望舒之魄也顧兔薦頴兮燃桂以為墨也雲蒸霧蔚兮中興之德澤也從六龍兮浮日域也拂扶桑兮宇宙窄也驅雷霆兮拯人厄也戮鯨鯢兮妖蟇磔也玉振金聲兮君子德也摛藻天庭兮文華國也韋編三絶兮探其賾也抱槧懷鉛兮𤣥尚白也志在春秋兮麟之獲也誦龍蛇之章兮去無迹也子孫寶之兮不在乎龍尾之石也漆硯銘有序昔北海侯譜硯載古以玉石雷斧鐵甓為者惟晉太子納妃有漆硯余得之永嘉髹工凝漆而成勒銘識之孚尹縝栗謂爾玉質溫潤而澤則凝其石追琢就窪醫然無瑕鄭人臘鼠荆山扺鵲靡俟三獻薦于几格意鹿臺髹工之棄孔壁汗簡之餘友陳𤣥與毛穎伴草𤣥而著書贊李氏龍池庵芝草贊並序金芝瑞堯庭之嵗余調官都下伯兄自霅川上冡還書抵余以靈芝生龍塢告實先公佳城兆域也靈華曄然色嫓綬紫顯示默告用侈潜光蓋距窀穸之年一星終矣山川之美鍾于植物以彰我伯仲孝友之懿垂裕燕翼宜有頌詩謹托實而贊之元精絪緼回復産祥萃于靈華煒曄其光靈華伊何龍塢之麓覆以卿雲守以麋鹿樵人以告天畀徴符醇和粹美瑞鈞友于龍塢之雲崇朝而雨嫓我先德澤潤終古龍塢之泉蔭以松柏演漾涵瀦既甘且食山川盤鬱秀于酉申嵗星一終以闡坤珍蔓蔓日茂連葉菌蠢紛至沓來其應莫眹孝子不匱既蕃既息詩以贊之垂休罔極冦萊公贊堂堂萊公龍章鳯姿文武憲邦太宗知之景德之元獫狁侵邊公相天子胸奴讋焉真宗倚公躬乘戎輅七萃六師闞如虓虎公仗黃鉞克揚天聲不敢多殺從其乞盟遂講和戎誓天㰱血南北赤子永享黃髮公在廟堂四方訓之身遭讒黜節無磷緇我覩公像英風凛凛微管之歎吾其左袵在仁宗時敵情中渝鄭公繼焉尋盟如初非天私我有邦惟天佑于一德篤生巨賢以幹王國社稷之福澤在生民即圖稱贊以勸為臣羡門子贊東海神山方壺蓬萊安期羡門飛相往來跨嬴越劉名傳實隱無意無必太冲莫眹區區方士媚世好誇徒瞻雲飛空傳棗瓜形容誰寫我觀莞爾噫羡門子有口如耳蓬萊都水使者贊有序蓬萊都水使者陶真人自寫形于四明之蓬萊觀在昔真宗朝採玉清昭應宫木于海上阻風中使見海氣中真人噀水獲達于岸事載于碑朐山劉子材為四明幕官摹得之蓋貞白陶隱居也因為贊之先生在梁兮華陽隱居學道成仙兮出有入無寓形琳宮兮眉宇軒如我敬瞻禮兮縑素所撫雲披月露兮飄飄凌虛山中宰相兮强名之歟沈時仲畫贊有序錢唐沈時仲老成篤學豫頃官海昌即與之遊乾道乙酉訪豫于都城因出寫照時踰耳順談古今閲細書雖少壯所不逮一時輩流皆騫騰不肯俯首求仕以衡嶽祿隱自佚因為贊之鶴髮緇衣香山之皤叟幅巾植杖斜川之逸民腹有萬卷書而羞折腰于五斗年開第八秩而獨尋樂于天真彼忌鵩畏犧全生者益寡則求田問舍自放于寂寞之濵劉蓑衣畫贊並序茅山劉蓑衣紹興戊辰被詔至闕下客有得其繪像者命工傳肖而贊之神聖御㝢崆峒訪道不殺為仁慈儉為寶翩翩鶴駕來㑹法宫肆觀真人如雲從龍惟時蓑衣幅巾草屨顧揖萬乘對敡天語蓑衣蓑衣道妙太微吐納二景夀侔兩儀方瞳尺宅練素傳貌清風照人驕忮披橈箕山洗耳具茨隱藏猗歟蓑衣視古有光逺覽德輝翺翔下翥既覿堯眉泛然辭去良常之麓仙真所居蘭室蘅臯于焉踟蹰我瞻晬容思見顔色庶幾一盻神逰八極服膺寤寐爰寫心聲靈臺莫狀空詠丹青跋跋盤谷圖乾道壬辰重陽余客雲間錢師魏家觀趙祖文畫歸來盤谷二大圖見其位置豐富余嘆曰願將家子豈真隱者特博徒之雄耳韓退之厄窮于時文章之遊俠也戲弄翰墨以鳴其不平借願為喻豈當與斜川為偶耶坐客皆稱善及考唐史亦載願歷方鎮卒以聲色荒侈敗退之作文不見嵗月及閲歐陽棐集古録則知其貞元中刻石當是時退之間關一第從辟汴徐自四門博士始得監察御史時年三十五論事觸幸臣為李實讒貶山陽令方其少年負功名之志宜乎有激而欲從願于盤谷也是嵗除夕前二日風雪塞門康道出此軸求跋因直筆叙余言綴諸公之後跋陳戶曹陰德記何比干為汝陰獄决曹掾活數千人神嫗告符天乃錫䇿以廣子孫探懷出䇿長九寸凡九百九十枚以授比干子孫佩印綬者當如此䇿天之報善而貴陰德如是豈單見淺聞者可擬議哉戶曹修德積善在躬豈望報乎而貽厥方來之告符猶以二十大夫為信亶亦異矣樞學揚其光敷文濟其美日華嗣其慶盛德之後莫京之祉于此益顯異日當知斯言之不妄云跋陶彭澤歸去來圖陶彭澤可謂善居貧矣其出處之節余固不論也讀其詩九日閒居則曰塵爵恥空罍怨詩則曰夏日長抱饑寒夜無被眠嵗暮則曰屢闕清酤至始作鎮軍則曰被褐欣自得屢空常晏如與從弟則曰深得固窮節飲酒則曰饑寒飽所更有㑹而作則曰老至更長饑詠貧士則曰量力守故轍豈不寒與饑傾壺絶餘瀝窺竈不見煙敝襟不掩肘藜羮常乏斟歸來自序曰家貧耕植不足自給幼稚滿室瓶無儲粟及其恥一束帶見鄉里小兒則又有饑凍雖切違已交病之語是豈有一毫矯飾于其心哉信吾夫子所謂人不堪其憂回也不改其樂余素貧蓋深味其旨未嘗不掩卷長太息也余豈敢尚友彭澤然嵗儉居貧備嘗彭澤詩中之趣因觀康道此軸附見余所好于後跋戶曹考課牒考課之法在唐為詳有四善二十七最之目國初踵前武太宗出誡勵京朝官聖語云政惠臨民奉法除姦方可書為勞績先是給御前印紙厯子書其課至是别撰誡勵詞親書連于印紙之前仍詔審官院錢若水吕祐之曰中有奉法除姦之語恐不曉者則生事以求功勞可語之曰除姦之要在于奉法大哉聖訓斯所以致我宋有永之祚也今觀戶曹陳公雍熙端拱淳化中考課三牒概見當時四方萬里之廣簿領掾曹之卑勤身奉法考課殿最繩繩乎如唐虞成周之盛某既録副墨藏於家敬書其後以歸陳氏祭文祭嘉州叔父文嗚呼叔父德富命迍宰邑連最吳松絶倫錫對丹墀將登要津佐郡劇邊自隨移均叱馭蜀坂三駕朱轓膚使列剡名徹帝閽增秩示寵簡注中宸力丐香火歸崇净因逰心華藏再轉法輪恍若靈鷲記莂夙遵奄忽殂謝夀彌七旬階升卿列金紫章身燕翼無嗣孰測蒼旻自卜夀岡生樂海濵孑立幼姝羸疾僅存往從其夫簿領漢濆朅來舊邑饋奠獲親顧懷存殁悲哽奚言松檟儼立淒愴蒿焄氷結淚睫愁凝隴雲再拜酹觴哀而不文祭大監季父文嗚呼南渡以來自先公薨十八年間死喪相仍嵗一終星御史傾殞嘉州之喪今甫再閏季父遽亡翦焉殆盡嗚呼哀哉惟我季父德宇純粹文學懿華見推前輩三分守符􅏡厯逺外晚際更化召自郢中錫對前旒啓沃帝聰結綬中朝丞于大農為郎天官羽儀省戶時推老成金玉憲度鴈序之祥踵先公武平允持衡銓綜多譽太上視師凱奏鏘金堯舜內禪抒頌獻針洋洋具美治世之音奚斯頌魯宗工所欽詔藏史館榮動書林躋于大匠造膝蹇諤遂膺簡知駸駸從橐夫何引疾寓直延閣起乘軺傳趣覲帷幄媢忌扺巇欲進復却浩然賦歸志存靜樂燕閒篇什平窺少陵氣吞韓栁碑版嗣興傳心之要𢎞智親承直截了悟略去葛藤蕭然晚嵗如在家僧某雖生晚承誨弱嵗忽聞垂車失聲涕墜孑立索居欲去不可亟馳一介問安寢門力疾答字溫言如春謂此沉痼恐難久存無因見子讀之愴神豈期旬月訃音來即逆旅負疴針艾療疾痛哭銜哀展轉一席山城尺雪歸卧蓬蓽家僮走陸往奠芬苾重江復嶺書到何日欲寫哀誠涕濡紙筆何嗟及矣慈訓永失
